<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWNA Chapter 2 Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="radio"], input[type="checkbox"] {
            accent-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="max-w-3xl mx-auto mb-10 relative">
        <a href="index.html" class="inline-flex items-center text-indigo-400 hover:text-indigo-300 transition-colors mb-4 text-sm font-medium">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">Chapter 2: IEEE 802.11 Standard and Amendments</h1>
            <p class="text-slate-400">Complete the questions below. The order of questions and answers are randomized.</p>
        </div>
    </header>

    <!-- Quiz Container -->
    <main id="quiz-container" class="max-w-3xl mx-auto space-y-8 flex flex-col items-center">
        <!-- Questions will be injected here via JavaScript -->
    </main>

    <script>
        const quizData = [
            {
                id: 1,
                type: 'single',
                question: 'The Wi-Fi HaLow certification from the Wi-Fi Alliance will likely be used for sensor networks and Internet of Things (IoT) devices and is based on which IEEE amendment?',
                options: ['802.11aq', '802.11ak', '802.11ae', '802.11ai', '802.11ah'],
                correctAnswers: ['802.11ah'],
                explanation: '802.11ah defines the use of Wi-Fi in frequencies below 1 GHz and is the basis for the Wi-Fi HaLow certification. The lower frequencies will provide longer distances, which will prove useful for sensors, IoT devices, and machine-to-machine (M2M) communications.'
            },
            {
                id: 2,
                type: 'single',
                question: 'Which amendment defines performance enhancements using the much higher unlicensed frequency band of 60 GHz, and a transmission method known as directional multi-gigabit (DMG)?',
                options: ['802.11ac', '802.11ad', '802.11ay', '802.11q', '802.11z'],
                correctAnswers: ['802.11ad'],
                explanation: '802.11ad supports data rates of up to 7 Gbps. The downside is that 60 GHz will have significantly less effective range than a 5 GHz signal and be limited to line-of-sight communications, as the high-frequency signal will have difficulty penetrating walls. The 802.11ay draft amendment is expected to improve 802.11ad, providing faster speeds and longer range.'
            },
            {
                id: 3,
                type: 'multiple',
                question: 'Which types of devices were defined in the original 802.11 standard? (Choose all that apply.)',
                options: ['OFDM', 'DSSS', 'HR-DSSS', 'IR', 'FHSS', 'ERP'],
                correctAnswers: ['DSSS', 'IR', 'FHSS'],
                explanation: 'The original 802.11 standard defined three Physical layer specifications. An 802.11 legacy network could use frequency-hopping spread-spectrum (FHSS), direct-sequence spread-spectrum (DSSS), or IR (infrared) technology. 802.11b defined the use of High-Rate DSSS (HR-DSSS); 802.11a defined the use of orthogonal frequency-division multiplexing (OFDM); 802.11g defined Extended Rate Physical (ERP); 802.11n defined High Throughput (HT); 802.11ac defined Very High Throughput (VHT); and 802.11ax defines High Efficiency (HE).'
            },
            {
                id: 4,
                type: 'single',
                question: 'Which 802.11 amendment defines wireless mesh networking mechanisms?',
                options: ['802.11n', '802.11u', '802.11s', '802.11v', '802.11k'],
                correctAnswers: ['802.11s'],
                explanation: 'The 802.11 Task Group s (TGs) has set forth the pursuit of standardizing mesh networking using the IEEE 802.11 MAC/PHY layers. The 802.11s amendment defines the use of mesh points (MPs), which are 802.11 QoS stations that support mesh services. An MP is capable of using a mandatory mesh routing protocol called Hybrid Wireless Mesh Protocol (HWMP) that uses a default path selection metric. Vendors may also use proprietary mesh routing protocols and metrics.'
            },
            {
                id: 5,
                type: 'multiple',
                question: 'A robust security network (RSN) requires the use of which security mechanisms? (Choose all that apply.)',
                options: ['802.11x', 'WEP', 'IPsec', 'CCMP/AES', 'CKIP', '802.1X'],
                correctAnswers: ['CCMP/AES', '802.1X'],
                explanation: 'The required encryption method defined by an RSN wireless network (802.11i) is Counter Mode with Cipher Block Chaining Message Authentication Code Protocol (CCMP), which uses the Advanced Encryption Standard (AES) algorithm. The 802.11i amendment also requires the use of an 802.1X/EAP authentication solution or the use of preshared keys.'
            },
            {
                id: 6,
                type: 'single',
                question: 'An 802.11ac radio can transmit on what frequency and uses which spread-spectrum technology?',
                options: ['5 MHz, OFDM', '2.4 GHz, HR-DSSS', '2.4 GHz, ERP-OFDM', '5 GHz, VHT', '5 GHz, DSSS'],
                correctAnswers: ['5 GHz, VHT'],
                explanation: '802.11ac radio cards operate in the 5 GHz frequency bands using very high throughput (VHT).'
            },
            {
                id: 7,
                type: 'single',
                question: 'What are the required data rates of an OFDM station?',
                options: ['3, 6, and 12 Mbps', '6, 9, 12, 18, 24, 36, 48, and 54 Mbps', '6, 12, 24, and 54 Mbps', '6, 12, and 24 Mbps', '1, 2, 5.5, and 11 Mbps'],
                correctAnswers: ['6, 12, and 24 Mbps'],
                explanation: 'The IEEE 802.11-2020 standard requires data rates of 6, 12, and 24 Mbps for both orthogonal frequency-division multiplexing (OFDM) 802.11a radios and Extended Rate Physical OFDM (ERP-OFDM) 802.11g radios. Data rates of 6, 9, 12, 18, 24, 36, 48, and 54 Mbps are typically supported. 54 Mbps is the maximum defined rate for these two 802.11 technologies (802.11a and 802.11g).'
            },
            {
                id: 8,
                type: 'single',
                question: 'When implementing an 802.1X/EAP RSN network with a VoWiFi solution, what is needed to avoid latency issues during roaming?',
                options: ['Inter-Access Point Protocol', 'Fast BSS transition', 'Distributed Coordination Function', 'Roaming Coordination Function', 'Lightweight APs'],
                correctAnswers: ['Fast BSS transition'],
                explanation: 'Fast basic service set transition (FT), also known as fast-secure roaming, defines fast handoffs when roaming occurs between cells in a WLAN using the strong security defined in a robust security network (RSN). Applications such as VoIP that necessitate timely delivery of packets require the roaming handoff to occur in 150 ms or less.'
            },
            {
                id: 9,
                type: 'multiple',
                question: 'Which technologies debuted in the 802.11ac-2013 amendment? (Choose all that apply.)',
                options: ['MIMO', 'MU-MIMO', '256-QAM', '40 MHz channels', '80 MHz channels'],
                correctAnswers: ['MU-MIMO', '256-QAM', '80 MHz channels'],
                explanation: 'The 802.11ac amendment debuted and defined the use of 256-QAM modulation, eight spatial streams, multi-user MIMO (MU-MIMO), 80 MHz channels, and 160 MHz channels. 802.11 MIMO technology and 40 MHz channels debuted with the ratification of the 802.11n amendment.'
            },
            {
                id: 10,
                type: 'single',
                question: 'The TV white space (TVWS) frequencies operate between 54 MHz and 790 MHz, use a new PHY known as TVHT, and are defined by which 802.11 amendment?',
                options: ['802.11af', '802.11y', '802.11a', '802.11aa', '802.11ad'],
                correctAnswers: ['802.11af'],
                explanation: 'The 802.11af amendment allows the use of wireless in the TV white space (TVWS) frequencies between 54 MHz and 790 MHz. The Physical layer is based on the OFDM technology used in 802.11ac, using smaller channel widths than 802.11ac along with a maximum of four spatial streams. This new PHY is known as television very high throughput (TVHT) and is designed to support the narrow TV channels that are made available by TVWS.'
            },
            {
                id: 11,
                type: 'multiple',
                question: 'Which two technologies are used to prevent 802.11 radios from interfering with radar and satellite transmissions at 5 GHz?',
                options: [
                    'Dynamic frequency selection', 
                    'Enhanced Distributed Channel Access', 
                    'Direct-sequence spread-spectrum', 
                    'Temporal Key Integrity Protocol', 
                    'Transmit power control'
                ],
                correctAnswers: ['Dynamic frequency selection', 'Transmit power control'],
                explanation: 'The 802.11-2020 standard defines mechanisms for dynamic frequency selection (DFS) and transmit power control (TPC) that may be used to satisfy regulatory requirements for operation in the 5 GHz band. DFS and TPC technology were originally defined in the 802.11h amendment, which is now part of the 802.11-2020 standard.'
            },
            {
                id: 12,
                type: 'multiple',
                question: 'Which 802.11 amendments provide for throughput of 1 Gbps or higher? (Choose all that apply.)',
                options: ['802.11aa', '802.11ab', '802.11ac', '802.11ad', '802.11ae', '802.11af'],
                correctAnswers: ['802.11ac', '802.11ad'],
                explanation: 'The 802.11ac and 802.11ad amendments are often referred to as the "gigabit Wi-Fi" amendments because they define data rates of greater than 1 Gbps. The 802.11ac and 802.11ad very high throughput (VHT) task groups define transmission rates of up to 7 Gbps in an 802.11 environment.'
            },
            {
                id: 13,
                type: 'multiple',
                question: 'As defined by the 802.11-2020 standard, which equipment is compatible? (Choose all that apply.)',
                options: ['ERP and HR-DSSS', 'HR-DSSS and FHSS', 'VHT and OFDM', '802.11h and 802.11a', 'HR-DSSS and DSSS'],
                correctAnswers: ['ERP and HR-DSSS', 'VHT and OFDM', '802.11h and 802.11a', 'HR-DSSS and DSSS'],
                explanation: 'ERP (802.11g) requires the use of Extended Rate Physical OFDM (ERP-OFDM) and Extended Rate Physical DSSS (ERP-DSSS/CCK) in the 2.4 GHz industrial, scientific, and medical (ISM) band and is backward compatible with 802.11b High-Rate DSSS (HR-DSSS) and direct-sequence spread-spectrum (DSSS) equipment. 802.11b uses HR-DSSS in the 2.4 GHz ISM band and is backward compatible with only legacy DSSS equipment and not legacy frequency-hopping spread-spectrum (FHSS) equipment. 802.11ac uses very high throughput (VHT) and is backward compatible with 802.11a orthogonal frequency-division multiplexing (OFDM). The 802.11h amendment defines the use of transmit power control (TPC) and dynamic frequency selection (DFS) in the 5 GHz Unlicensed National Information Infrastructure (U-NII) bands and is an enhancement of the 802.11a amendment. OFDM technology is used with all 802.11a- and 802.11h-compliant radios.'
            },
            {
                id: 14,
                type: 'single',
                question: 'What is the maximum data rate defined by the 802.11ac amendment?',
                options: ['54 Mbps', '1300 Mbps', '3466.7 Mbps', '6933.3 Mbps', '60 Gbps'],
                correctAnswers: ['6933.3 Mbps'],
                explanation: 'The 802.11ac amendment defines a maximum rate of 6933.3 Mbps. However, 802.11ac chipsets have gone through multiple generations with different capabilities. The maximum data rate for most first-generation 802.11ac devices is 1300 Mbps, and the maximum data rate for most second-generation 802.11ac devices is 3466.7 Mbps. Remember that data rates do not equate to actual throughput.'
            },
            {
                id: 15,
                type: 'multiple',
                question: 'What are the security options available as defined in the original IEEE Std 802.11-1999 (R2003)? (Choose all that apply.)',
                options: ['CCMP/AES', 'Open System authentication', 'Preshared keys', 'Shared Key authentication', 'WEP', 'TKIP'],
                correctAnswers: ['Open System authentication', 'Shared Key authentication', 'WEP'],
                explanation: 'The original 802.11 standard defined the use of Wired Equivalent Privacy (WEP) for encryption. The original 802.11 standard also defined two methods of authentication: Open System authentication and Shared Key authentication. TKIP was introduced in 2002 to address security flaws discovered in WEP. In 2012 both WEP and TKIP were deprecated from the 802.11 standard.'
            },
            {
                id: 16,
                type: 'single',
                question: 'The 802.11u-2011 amendment is also known as what?',
                options: [
                    'WIEN (Wireless Interworking with External Networks)', 
                    'WLAN (wireless local area networking)', 
                    'WPP (Wireless Performance Prediction)', 
                    'WAVE (Wireless Access in Vehicular Environments)', 
                    'WAP (Wireless Access Protocol)'
                ],
                correctAnswers: ['WIEN (Wireless Interworking with External Networks)'],
                explanation: 'The 802.11u draft amendment defines integration of IEEE 802.11 access networks with external networks in a generic and standardized manner. 802.11u is often referred to as Wireless Interworking with External Networks (WIEN).'
            },
            {
                id: 17,
                type: 'multiple',
                question: 'The 802.11-2020 standard defines which two technologies for quality of service (QoS) in a WLAN?',
                options: [
                    'EDCA', 
                    'PCF', 
                    'Hybrid Coordination Function Controlled Channel Access', 
                    'VOIP', 
                    'Distributed Coordination Function', 
                    'VoWiFi'
                ],
                correctAnswers: ['EDCA', 'Hybrid Coordination Function Controlled Channel Access'],
                explanation: 'The 802.11e amendment (now part of the 802.11-2020 standard) defined two enhanced medium access methods to support quality of service (QoS) requirements. Enhanced Distributed Channel Access (EDCA) is an extension to Distributed Coordination Function (DCF). Hybrid Coordination Function Controlled Channel Access (HCCA) is an extension to PCF. In the real world, only EDCA is implemented.'
            },
            {
                id: 18,
                type: 'multiple',
                question: 'The 802.11h amendment (now part of the 802.11-2020 standard) introduced which two major changes for 5 GHz radios?',
                options: ['TPC', 'IAPP', 'DFS', 'DMG', 'FHSS'],
                correctAnswers: ['TPC', 'DFS'],
                explanation: 'The 802.11h amendment introduced two major enhancements: transmit power control (TPC) and dynamic frequency selection (DFS) for radar avoidance and detection. All aspects of the 802.11h ratified amendment can now be found in the 802.11-2020 standard.'
            },
            {
                id: 19,
                type: 'single',
                question: 'The 802.11n amendment defined which PHY?',
                options: ['HR-DSSS', 'FHSS', 'OFDM', 'PBCC', 'HT', 'VHT'],
                correctAnswers: ['HT'],
                explanation: 'The 802.11n high throughput (HT) amendment defined MAC and PHY enhancements, whereas radios can transmit at data rates up to 600 Mbps.'
            },
            {
                id: 20,
                type: 'multiple',
                question: 'Which layers of the OSI model are referenced in the 802.11 standard? (Choose all that apply.)',
                options: ['Application', 'Data-Link', 'Presentation', 'Physical', 'Transport', 'Network'],
                correctAnswers: ['Data-Link', 'Physical'],
                explanation: 'The IEEE specifically defines 802.11 technologies at the Physical layer and the MAC sublayer of the Data-Link layer. By design, anything that occurs at the upper layers of the OSI model is insignificant to 802.11 communications.'
            }
        ];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            const shuffledQuestions = shuffleArray([...quizData]);

            shuffledQuestions.forEach((q, index) => {
                const shuffledOptions = shuffleArray([...q.options]);
                const qCard = document.createElement('div');
                qCard.className = 'w-full bg-slate-800 rounded-xl shadow-lg p-6 md:p-8 border border-slate-700';
                
                let optionsHtml = '';
                shuffledOptions.forEach(opt => {
                    const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                    const inputName = `question-${q.id}`;
                    const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                    
                    optionsHtml += `
                        <label id="label-${inputId}" class="flex items-start gap-3 p-4 rounded-lg border border-slate-700 bg-slate-700/30 cursor-pointer hover:bg-slate-700/60 transition-colors w-full">
                            <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-1 w-4 h-4 cursor-pointer text-indigo-600 bg-slate-900 border-slate-600 focus:ring-indigo-500 focus:ring-offset-slate-800">
                            <span class="text-slate-200 leading-relaxed break-words w-full">${opt}</span>
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="mb-6">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-indigo-300 bg-indigo-900/30 rounded-full">
                            ${q.type === 'single' ? 'SINGLE CHOICE' : 'MULTIPLE CHOICE'}
                        </span>
                        <h2 class="text-xl md:text-2xl font-medium text-white leading-snug">
                            <span class="text-indigo-400 font-bold mr-2">${index + 1}.</span>${q.question}
                        </h2>
                    </div>
                    <div class="flex flex-col gap-3" id="options-container-${q.id}">
                        ${optionsHtml}
                    </div>
                    ${q.type === 'multiple' ? `
                        <div class="mt-6 flex justify-end">
                            <button id="btn-${q.id}" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-colors w-full sm:w-auto shadow-md">
                                Check Answer
                            </button>
                        </div>
                    ` : ''}
                    <div id="explanation-${q.id}" class="hidden mt-6 p-5 rounded-lg bg-slate-900 border border-slate-700 shadow-inner">
                        <h4 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2">Explanation</h4>
                        <p class="text-slate-300 text-sm md:text-base leading-relaxed">${q.explanation}</p>
                    </div>
                `;
                
                container.appendChild(qCard);

                const inputs = qCard.querySelectorAll(`input[name="question-${q.id}"]`);
                
                if (q.type === 'single') {
                    inputs.forEach(input => {
                        input.addEventListener('change', () => evaluateAnswer(q, inputs, qCard));
                    });
                } else {
                    const btn = qCard.querySelector(`#btn-${q.id}`);
                    btn.addEventListener('click', () => {
                        evaluateAnswer(q, inputs, qCard);
                        btn.style.display = 'none';
                    });
                }
            });
        }

        function evaluateAnswer(questionData, inputs, cardElement) {
            const explanationBox = cardElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = cardElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-700/60', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-emerald-500', 'bg-emerald-900/30', 'text-emerald-100');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-rose-500', 'bg-rose-900/30', 'text-rose-100');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-emerald-500/50', 'bg-emerald-900/10');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
