    <script>
        const quizData = [
            {
                id: 1,
                type: 'multiple',
                question: 'Which terms best describe components of a centralized WLAN architecture where the management, control, and data planes all reside in a centralized device? (Choose all that apply.)',
                options: ['WLAN controller', 'Wireless network management system', 'Network management system', 'Distributed AP', 'Controller-based AP'],
                correctAnswers: ['WLAN controller', 'Controller-based AP'],
                explanation: 'In the centralized WLAN architecture, autonomous access points (APs) have been replaced with controller-based APs. All three logical planes of operation reside inside a centralized networking device known as a WLAN controller. Effectively, all planes were moved out of access points and into a WLAN controller. It should be noted that a network management system (NMS) could be used to manage controllers and controller-based APs.[cite: 4]'
            },
            {
                id: 2,
                type: 'single',
                question: 'Which logical plane of network operation is typically defined by protocols and intelligence?',
                options: ['User plane', 'Data plane', 'Network plane', 'Control plane', 'Management plane'],
                correctAnswers: ['Control plane'],
                explanation: 'Telecommunication networks are often defined as three logical planes of operation. The control plane consists of control or signaling information and is often defined as network intelligence or protocols.[cite: 4]'
            },
            {
                id: 3,
                type: 'multiple',
                question: 'Which WLAN architectural models typically require support for 802.1Q tagging at the edge on the network when multiple user VLANs are required? (Choose all that apply.)',
                options: ['Autonomous WLAN architecture', 'Centralized WLAN architecture', 'Distributed WLAN architecture', 'None of the above'],
                correctAnswers: ['Autonomous WLAN architecture', 'Distributed WLAN architecture'],
                explanation: 'All three WLAN infrastructure designs support the use of virtual LANs (VLANs) and 802.1Q tagging. However, the centralized WLAN architecture usually encapsulates user VLANs between the controller-based access point (AP) and the WLAN controllers; therefore, only a single VLAN is normally required at the edge. An 802.1Q trunk is, however, usually required between the WLAN controller and a core switch. Neither the autonomous nor the distributed WLAN architectures use a controller. Noncontroller architectures require support for 802.1Q tagging if multiple VLANs are to be supported at the edge of the network. The access point is connected to an 802.1Q trunk port on an edge switch that supports VLAN tagging.[cite: 4]'
            },
            {
                id: 4,
                type: 'single',
                question: 'Which type of access points normally use centralized data forwarding?',
                options: ['Autonomous APs', 'Controller-based APs', 'Cooperative APs within a distributed WLAN architecture', 'None of the above'],
                correctAnswers: ['Controller-based APs'],
                explanation: 'Controller-based APs (access points) normally forward user traffic to a centralized WLAN controller via an encapsulated IP tunnel. Autonomous and cooperative access points normally use local data forwarding. Controller-based APs are also capable of local data forwarding. Although the whole point of a cooperative and distributed WLAN model is to avoid centrally forwarding user traffic to the core, the access points may also have IP-tunneling capabilities.[cite: 4]'
            },
            {
                id: 5,
                type: 'multiple',
                question: 'Which protocols can be used to tunnel 802.11 user traffic from access points to WLAN controllers or other centralized network servers? (Choose all that apply.)',
                options: ['IPsec', 'GRE', 'CAPWAP', 'DTLS', 'VRRP'],
                correctAnswers: ['IPsec', 'GRE', 'CAPWAP'],
                explanation: 'Many WLAN vendors use Generic Routing Encapsulation (GRE), which is a commonly used network tunneling protocol. Although GRE is often used to encapsulate IP packets, GRE can also be used to encapsulate an 802.11 frame inside an IP tunnel. The GRE tunnel creates a virtual point-to-point link between a controller-based access point (AP) and a WLAN controller. WLAN vendors that do not use GRE use other proprietary protocols for the IP tunneling. The Control and Provisioning of Wireless Access Points (CAPWAP) management protocol can also be used to tunnel user traffic. IPsec can also be used to securely tunnel user traffic from APs across a WAN link.[cite: 4]'
            },
            {
                id: 6,
                type: 'single',
                question: 'Which of these WLAN architectures may require the use of an NMS server to manage and monitor the WLAN?',
                options: ['Autonomous WLAN architecture', 'Centralized WLAN architecture', 'Distributed WLAN architecture', 'All of the above'],
                correctAnswers: ['All of the above'],
                explanation: 'One major disadvantage of using the traditional autonomous access point (AP) is that there is no central point of management. Any autonomous WLAN architecture with 25 or more access points is going to require some sort of network management system (NMS). Although a WLAN controller can be used to manage the WLAN in a centralized WLAN architecture, if multiple controllers are deployed, an NMS may be needed to manage multiple controllers. Although the control plane and management plane have moved back to the APs in a distributed WLAN architecture, the management plane remains centralized. Configuration and monitoring of all access points in the distributed model is still handled by an NMS. Most NMS solutions are now cloud-based management solutions.[cite: 4]'
            },
            {
                id: 7,
                type: 'single',
                question: 'What term best describes a WLAN centralized architecture where the integration service (IS) and distribution system services (DSSs) are handled by a WLAN controller while the generation of certain 802.11 management and control frames is handled by a controller-based AP?',
                options: ['Cooperative control', 'Distributed data forwarding', 'Distributed hybrid architecture', 'Distributed WLAN architecture', 'Split MAC'],
                correctAnswers: ['Split MAC'],
                explanation: 'The majority of WLAN controller vendors implement what is known as a split MAC architecture. With this type of WLAN architecture, some of the MAC services are handled by the WLAN controller and some are handled by the controller-based access point.[cite: 4]'
            },
            {
                id: 8,
                type: 'multiple',
                question: 'What are some of the necessary components of a VoWiFi network architecture? (Choose all that apply.)',
                options: ['VoWiFi phone', 'SIP', 'WMM support', 'Proxy server', 'PBX'],
                correctAnswers: ['VoWiFi phone', 'WMM support', 'PBX'],
                explanation: 'VoWiFi phones are 802.11 client stations that communicate through most WLAN architecture. The private branch exchange (PBX) is needed to make connections among the internal telephones of a private company and also connect them to the public switched telephone network (PSTN) via trunk lines. Wi-Fi Multimedia (WMM) quality-of-service capabilities must be supported by both the VoWiFi phone and WLAN infrastructure. Currently most Voice over Wi-Fi (VoWiFi) solutions use the Session Initiation Protocol (SIP) as the signaling protocol for voice communications over an IP network, but other protocols can be used instead.[cite: 4]'
            },
            {
                id: 9,
                type: 'single',
                question: 'What is the traditional data-forwarding model for 802.11 user traffic when WLAN controllers are deployed?',
                options: ['Distributed data forwarding', 'Autonomous forwarding', 'Proxy data forwarding', 'Centralized data forwarding', 'All of the above'],
                correctAnswers: ['Centralized data forwarding'],
                explanation: 'Centralized data forwarding is the traditional data-forwarding method used with WLAN controllers. All 802.11 user traffic is forwarded from the access point (AP) to the WLAN controller for processing, especially when the WLAN controller manages encryption and decryption or applies security and quality-of-service (QoS) policies. Most WLAN controller solutions also now support a distributed data plane. The controller-based AP performs data forwarding locally; it may be used in situations where it is advantageous to perform forwarding at the edge and to avoid a central location in the network for all data.[cite: 4]'
            },
            {
                id: 10,
                type: 'multiple',
                question: 'What are some of the security capabilities found in an enterprise WLAN router that is typically deployed in remote branch locations? (Choose all that apply.)',
                options: ['Integrated WIPS server', 'Integrated VPN server', 'Integrated NAC server', 'Integrated firewall', 'Integrated VPN client'],
                correctAnswers: ['Integrated firewall', 'Integrated VPN client'],
                explanation: 'A distributed solution using enterprise-grade WLAN routers is often deployed at company branch offices. Branch WLAN routers have the ability to connect back to corporate headquarters with virtual private network (VPN) tunnels using an integrated VPN client. Enterprise WLAN routers also have integrated firewalls with support for port forwarding, network address translation (NAT), and port address translation (PAT). Enterprise WLAN routers also offer full support for 802.11 security.[cite: 4]'
            },
            {
                id: 11,
                type: 'single',
                question: 'Which radio form factors can be used by 802.11 technology?',
                options: ['USB 3.0', 'Secure Digital', 'PCMCIA', 'Mini PCI', 'ExpressCard', 'Proprietary', 'All of the above'],
                correctAnswers: ['All of the above'],
                explanation: 'The 802.11 standard does not mandate what type of form factor must be used by an 802.11 radio. Although PCMCIA and Mini PCI client adapters are the most common, 802.11 radios exist in many other formats, such as CompactFlash cards, Secure Digital cards, USB dongles, ExpressCards, and other proprietary formats.[cite: 4]'
            },
            {
                id: 12,
                type: 'single',
                question: 'Which of these protocols can be used to configure WLAN infrastructure devices?',
                options: ['HTTP', 'SSH', 'SNMP', 'Telnet', 'HTTPS', 'All of the above'],
                correctAnswers: ['All of the above'],
                explanation: 'All of these protocols might be used to configure WLAN devices such as access points and WLAN controllers. However, written corporate policies should mandate the use of secure protocols such as SNMPv3, SSH2, and HTTPS.[cite: 4]'
            },
            {
                id: 13,
                type: 'single',
                question: 'What are some of the common capabilities of a WLAN controller architecture?',
                options: ['Adaptive RF', 'AP management', 'Layer 3 roaming support', 'Bandwidth throttling', 'Firewall', 'All of the above'],
                correctAnswers: ['All of the above'],
                explanation: 'WLAN controllers support layer 3 roaming capabilities, bandwidth policies, and stateful packet inspection. Adaptive RF, device monitoring, and AP management are also supported on a controller.[cite: 4]'
            },
            {
                id: 14,
                type: 'multiple',
                question: 'Which management protocols are often used between a network management system (NMS) server and remote access points for the purpose of monitoring a WLAN? (Choose all that apply.)',
                options: ['IPsec', 'GRE', 'CAPWAP', 'DTLS', 'SNMP'],
                correctAnswers: ['CAPWAP', 'SNMP'],
                explanation: 'Communications between a network management system (NMS) server and an AP (access point) require management and monitoring protocols. Most NMS solutions use the Simple Network Management Protocol (SNMP) to manage and monitor the WLAN. Other NMS solutions also use the Control and Provisioning of Wireless Access Points (CAPWAP) as strictly a monitoring and management protocol. CAPWAP incorporates Datagram Transport Layer Security (DTLS) to provide encryption and data privacy of the monitored management traffic. Other secure protocols such as HTTPS can be used to transport management traffic from a networking device to a NMS server or cloud platform.[cite: 4]'
            },
            {
                id: 15,
                type: 'single',
                question: 'What are of some of the common security capabilities often integrated within access points deployed in a distributed WLAN architecture?',
                options: ['Captive web portal', 'Firewall', 'Integrated RADIUS', 'WIPS', 'All of the above'],
                correctAnswers: ['All of the above'],
                explanation: 'Most of the security features found in WLAN controllers can also be found in a distributed WLAN architecture even though there is no WLAN controller. For example, a captive web portal that normally resides in a WLAN controller instead resides inside the individual APs (access points). The stateful firewall and role-based access control (RBAC) capabilities found in a centralized WLAN controller now exist cooperatively in the APs. An individual AP might also function as a RADIUS server with full Lightweight Directory Access Protocol (LDAP) integration capabilities. All control plane mechanisms reside in the access points at the edge of the network in a distributed WLAN architecture.[cite: 4]'
            },
            {
                id: 16,
                type: 'single',
                question: 'What RF technology do IoT client devices use for communication?',
                options: ['Wi-Fi', 'Bluetooth', 'Zigbee', 'All of the above'],
                correctAnswers: ['All of the above'],
                explanation: 'The bulk of IoT devices with an 802.11 radio currently transmit in the 2.4 GHz frequency band only. Please understand that not all IoT devices use Wi-Fi radios. IoT devices may use other RF technology such as Bluetooth or Zigbee. IoT devices may also have an Ethernet networking interface in addition to the RF interfaces.[cite: 4]'
            },
            {
                id: 17,
                type: 'single',
                question: 'What type of 802.11 radio form factor is normally used in mobile devices such as smartphones and tablets?',
                options: ['Integrated single chip', 'PCMCIA', 'Express Mini PCI', 'Mini PCI', 'Secure Digital'],
                correctAnswers: ['Integrated single chip'],
                explanation: 'Over the past decade, there has been a client population explosion of handheld mobile devices such as smartphones and tablets. Most users now expect Wi-Fi connectivity with numerous handheld mobile devices as well as their laptops. Almost all mobile devices use a single chip form factor that is embedded on the device\'s motherboard.[cite: 4]'
            },
            {
                id: 18,
                type: 'single',
                question: 'Where is redundancy needed if user traffic is being tunneled in a centralized WLAN architecture?',
                options: ['Redundant radios', 'Redundant controllers', 'Redundant access switches', 'Redundant access points', 'None of the above'],
                correctAnswers: ['Redundant controllers'],
                explanation: 'In a centralized WLAN architecture, traffic is tunneled from controller-based APs (access points) deployed at the access layer to a WLAN controller that is typically deployed at the core of the network. Standard network design suggests redundancy at the core, and redundant WLAN controllers should be deployed so that there is no single point of network failure. If all user traffic is being tunneled to a WLAN controller and it fails without a redundant solution, effectively the WLAN is down.[cite: 4]'
            },
            {
                id: 19,
                type: 'multiple',
                question: 'What are the available form factors for network management system (NMS) solutions? (Choose all that apply.)',
                options: ['Hardware appliance', 'Virtual appliance', 'Cloud subscription service', 'Integrated access point'],
                correctAnswers: ['Hardware appliance', 'Virtual appliance', 'Cloud subscription service'],
                explanation: 'Network management system (NMS) solutions can be deployed at a company data center in the form of a hardware appliance or as a virtual appliance that runs on VMware or some other virtualization platform. A network management system server that resides in a company\'s own data center is often referred to as an on-premises NMS. NMS solutions are more commonly available in the cloud as a software subscription service.[cite: 4]'
            },
            {
                id: 20,
                type: 'multiple',
                question: 'What planes of operation reside in the access points of a distributed WLAN architecture? (Choose all that apply.)',
                options: ['Radio plane', 'Data plane', 'Network plane', 'Control plane', 'Management plane'],
                correctAnswers: ['Data plane', 'Control plane'],
                explanation: 'The control plane mechanisms are enabled in the system with inter-AP communication via cooperative protocols in a distributed WLAN architecture. In a distributed architecture, each individual access point is responsible for local forwarding of user traffic; therefore, the data plane resides in the APs. The management plane resides in a network management system (NMS) that is used to manage and monitor the distributed WLAN.[cite: 4]'
            }
        ];

        // Pagination State
        let currentPage = 0;
        const questionsPerPage = 5;
        let totalPages = 0;
        let shuffledQuestions = [];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            shuffledQuestions = shuffleArray([...quizData]);
            totalPages = Math.ceil(shuffledQuestions.length / questionsPerPage);

            // Generate pages
            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.id = `page-${p}`;
                // Hide all pages except the first one
                pageDiv.className = p === 0 ? 'space-y-12' : 'space-y-12 hidden';
                
                const startIdx = p * questionsPerPage;
                const endIdx = Math.min(startIdx + questionsPerPage, shuffledQuestions.length);
                const pageQuestions = shuffledQuestions.slice(startIdx, endIdx);

                pageQuestions.forEach((q, idx) => {
                    const globalQuestionNumber = startIdx + idx + 1;
                    const shuffledOptions = shuffleArray([...q.options]);
                    
                    const qWrapper = document.createElement('div');
                    qWrapper.className = 'exam-question pb-8 border-b border-slate-800/80 last:border-0';
                    
                    let optionsHtml = '';
                    shuffledOptions.forEach(opt => {
                        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                        const inputName = `question-${q.id}`;
                        const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                        
                        optionsHtml += `
                            <label id="label-${inputId}" class="flex items-start gap-4 p-4 rounded-md border border-transparent cursor-pointer hover:bg-slate-800/50 transition-colors w-full">
                                <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-0.5 cursor-pointer">
                                <span class="text-slate-300 leading-relaxed">${opt}</span>
                            </label>
                        `;
                    });

                    qWrapper.innerHTML = `
                        <div class="mb-5 flex gap-3">
                            <span class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-semibold text-sm border border-slate-700">
                                ${globalQuestionNumber}
                            </span>
                            <div class="pt-1">
                                <span class="inline-block px-2 py-0.5 mb-3 text-[10px] font-bold tracking-wider text-slate-400 bg-slate-800 rounded uppercase border border-slate-700/50">
                                    ${q.type === 'single' ? 'Select One' : 'Select All That Apply'}
                                </span>
                                <h3 class="text-lg font-medium text-white leading-snug">${q.question}</h3>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 pl-11" id="options-container-${q.id}">
                            ${optionsHtml}
                        </div>
                        ${q.type === 'multiple' ? `
                            <div class="mt-4 pl-11">
                                <button id="btn-${q.id}" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded border border-slate-600 transition-colors">
                                    Check Selection
                                </button>
                            </div>
                        ` : ''}
                        <div id="explanation-${q.id}" class="hidden mt-6 ml-11 p-4 rounded-r-md bg-slate-800/50 border-l-4 border-red-600">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Explanation</h4>
                            <p class="text-slate-300 text-sm leading-relaxed">${q.explanation}</p>
                        </div>
                    `;
                    
                    pageDiv.appendChild(qWrapper);

                    const inputs = qWrapper.querySelectorAll(`input[name="question-${q.id}"]`);
                    
                    if (q.type === 'single') {
                        inputs.forEach(input => {
                            input.addEventListener('change', () => evaluateAnswer(q, inputs, qWrapper));
                        });
                    } else {
                        const btn = qWrapper.querySelector(`#btn-${q.id}`);
                        btn.addEventListener('click', () => {
                            evaluateAnswer(q, inputs, qWrapper);
                            btn.style.display = 'none';
                        });
                    }
                });

                container.appendChild(pageDiv);
            }

            setupPaginationControls();
        }

        function setupPaginationControls() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            updatePaginationUI();

            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage--;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage++;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Restart state
                    window.location.reload();
                }
            });
        }

        function updatePaginationUI() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('progress-indicator');

            indicator.textContent = `Page ${currentPage + 1} of ${totalPages}`;

            if (currentPage === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentPage === totalPages - 1) {
                nextBtn.innerHTML = `Restart Quiz <i class="fa-solid fa-rotate-right"></i>`;
                nextBtn.classList.replace('bg-red-600', 'bg-emerald-600');
                nextBtn.classList.replace('hover:bg-red-500', 'hover:bg-emerald-500');
                nextBtn.classList.replace('shadow-red-900/20', 'shadow-emerald-900/20');
            } else {
                nextBtn.innerHTML = `Next <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.classList.replace('bg-emerald-600', 'bg-red-600');
                nextBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-red-500');
                nextBtn.classList.replace('shadow-emerald-900/20', 'shadow-red-900/20');
            }
        }

        function evaluateAnswer(questionData, inputs, wrapperElement) {
            const explanationBox = wrapperElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = wrapperElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-800/50', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.add('bg-emerald-900/20', 'border-emerald-500/50');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.add('bg-rose-900/20', 'border-rose-500/50');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.add('border-dashed', 'border-emerald-500/50');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
