<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWNA Chapter 6 Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="radio"], input[type="checkbox"] {
            accent-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="max-w-3xl mx-auto mb-10 relative">
        <a href="index.html" class="inline-flex items-center text-indigo-400 hover:text-indigo-300 transition-colors mb-4 text-sm font-medium">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">Chapter 6: Wireless Networks and Spread Spectrum Technologies</h1>
            <p class="text-slate-400">Complete the questions below. The order of questions and answers are randomized.</p>
        </div>
    </header>

    <!-- Quiz Container -->
    <main id="quiz-container" class="max-w-3xl mx-auto space-y-8 flex flex-col items-center">
        <!-- Questions will be injected here via JavaScript -->
    </main>

    <script>
        const quizData = [
            {
                id: 1,
                type: 'single',
                question: 'Which technology has a greater tolerance of delay spread?',
                options: ['DSSS', 'FHSS', 'OFDM', 'HR-DSSS'],
                correctAnswers: ['OFDM'],
                explanation: 'OFDM has a greater tolerance of delay spread over previous methods, such as FHSS, DSSS, and HR-DSSS.'
            },
            {
                id: 2,
                type: 'multiple',
                question: 'Which is often used to describe the "shape" of a frequency channel? (Choose all that apply.)',
                options: ['Maximum spectral density', 'Transmit spectral mask', 'Radio spectrum', 'Spectrum mask'],
                correctAnswers: ['Transmit spectral mask', 'Spectrum mask'],
                explanation: 'The transmit spectrum mask, also referred to as spectral mask, is used to define the spectral density limitations of 802.11 WLAN transmissions. Sometimes the spectral mask is referenced as the shape of a channel. Instead, try to think of the spectral mask as the frequency width at which signal power must decrease by a certain amount.'
            },
            {
                id: 3,
                type: 'single',
                question: 'Which term best describes modulation accuracy?',
                options: ['EVM', 'ERP', 'VHT', 'QAM'],
                correctAnswers: ['EVM'],
                explanation: 'Error vector magnitude (EVM) is a measure used to quantify the performance of a radio receiver or transmitter in regard to modulation accuracy. With QAM modulation, EVM is a measure of how far a received signal is from an ideal constellation point location. Another way to describe EVM is a measure of how much the signal constellation points deviate from the ideal locations.'
            },
            {
                id: 4,
                type: 'multiple',
                question: '802.11n (HT radios) can transmit in which frequency bands? (Choose all that apply.)',
                options: ['2.4 GHz-2.4835 GHz', '5.47 GHz-5.725 GHz', '902 GHz-928 GHz', '5.15 GHz-5.25 GHz'],
                correctAnswers: ['2.4 GHz-2.4835 GHz', '5.47 GHz-5.725 GHz', '5.15 GHz-5.25 GHz'],
                explanation: 'The IEEE 802.11-2020 standard specifies that 802.11n HT radios can transmit in the 2.4 GHz ISM band and all four of the current 5 GHz U-NII bands.'
            },
            {
                id: 5,
                type: 'single',
                question: 'A 20 MHz OFDM channel uses how many 312.5 KHz subcarriers to modulate data when transmitted by an 802.11a/g radio?',
                options: ['64', '52', '48', '36'],
                correctAnswers: ['48'],
                explanation: 'A 20 MHz OFDM channel has 64 subcarriers (tones), but only 48 of them are used to transport modulated data between 802.11a/g radios. Twelve of the 64 subcarriers in a 20 MHz OFDM channel are unused and serve as guard bands, and four of the subcarriers function as pilot carriers. 802.11n/ac radios also transmit on a 20 MHz channel that consists of 64 total subcarriers; however, only 8 subcarriers are guard bands. Fifty-two of the subcarriers are used to transmit modulated data, and four of the subcarriers function as pilot carriers.'
            },
            {
                id: 6,
                type: 'single',
                question: 'Which of these client radios will be able to transmit in the U-NII-5 band?',
                options: ['Wi-Fi 4 client radios', 'Wi-Fi 5 client radios', 'Wi-Fi 6 client radios', 'Wi-Fi 6E client radios', 'Wi-Fi 7 client radios'],
                correctAnswers: ['Wi-Fi 6E client radios'],
                explanation: 'In early 2020, the FCC voted unanimously to make 1,200 megahertz of spectrum in the 6 GHz band available for unlicensed use in the United States. There will be as many as 59 new 20 MHz channels available across 4 U-NII bands (including U-NII-5). WLAN vendors will build Wi-Fi 6E access points in many different form factors, but in most cases they will have radios for all three bands (2.4, 5, and 6 GHz). However, only new Wi-Fi 6E client devices with 6 GHz radios will be able to communicate with the 6 GHz radio in a Wi-Fi 6E access point. An older dual-frequency (2.4 and 5 GHz) smartphone will only be able to communicate with the 2.4 or 5 GHz radios in a tri-band Wi-Fi 6E AP.'
            },
            {
                id: 7,
                type: 'single',
                question: 'What is the frequency width of a standard OFDM channel?',
                options: ['20 MHz', '22 MHz', '25 MHz', '40 MHz', '80 MHz', '160 MHz'],
                correctAnswers: ['20 MHz'],
                explanation: 'The frequency width used by a standard OFDM channel is approximately 20 MHz (as defined by the spectral mask). However, 802.11n/ac/ax radios have the ability to bond 20 MHz channels together. 40 MHz channels are essentially two 20 MHz OFDM channels that are bonded together. The 40 MHz spectral mask looks identical to the 20 MHz spectral mask except that it is twice as wide. The spectral mask of an 80 MHz channel looks similar to the 20 MHz spectral mask except that it is four times as wide.'
            },
            {
                id: 8,
                type: 'single',
                question: 'What best describes hop time?',
                options: [
                    'The period of time that the transmitter waits before hopping to the next frequency',
                    'The period of time that the standard requires when hopping between frequencies',
                    'The period of time that the transmitter takes to hop to the next frequency',
                    'The period of time that the transmitter takes to hop through all the FHSS frequencies'
                ],
                correctAnswers: ['The period of time that the transmitter takes to hop to the next frequency'],
                explanation: 'The time that the transmitter waits before hopping to the next frequency is known as the dwell time. The hop time is not a required time but rather a measurement of how long the hop takes.'
            },
            {
                id: 9,
                type: 'single',
                question: 'As defined by the IEEE 802.11-2020 standard, how much separation is needed between center frequencies of channels in the U-NII-2C band?',
                options: ['10 MHz', '20 MHz', '22 MHz', '25 MHz', '30 MHz'],
                correctAnswers: ['20 MHz'],
                explanation: 'The 802.11a amendment, which originally defined the use of OFDM, required 20 MHz of separation between the center frequencies for channels to be considered nonoverlapping. All 25 channels in the 5 GHz U-NII bands use OFDM and have 20 MHz of separation. Therefore, all 5 GHz OFDM channels are considered nonoverlapping by the IEEE. However, it should be noted that adjacent 5 GHz channels do have some sideband carrier frequency overlap.'
            },
            {
                id: 10,
                type: 'multiple',
                question: 'Which of these 802.11 technologies can operate in the 5 GHz frequency band? (Choose all that apply.)',
                options: ['802.11a (OFDM radios)', '802.11b (HR-DSSS radios)', '802.11g (ERP radios)', '802.11n (HT radios)', '802.11ac (VHT radios)', '802.11ax (HE radios)'],
                correctAnswers: ['802.11a (OFDM radios)', '802.11n (HT radios)', '802.11ac (VHT radios)', '802.11ax (HE radios)'],
                explanation: 'Wi-Fi radios that currently transmit in the 5 GHz U-NII bands include radios that use the following technologies: 802.11a, 802.11n, 802.11ac, and 802.11ax.'
            },
            {
                id: 11,
                type: 'single',
                question: 'Which U-NII band is currently designated for possible wireless communications of an automotive intelligent transportation system (ITS)?',
                options: ['U-NII-1', 'U-NII-2A', 'U-NII-2B', 'U-NII-2C', 'U-NII-3', 'U-NII-4'],
                correctAnswers: ['U-NII-4'],
                explanation: 'Although the FCC is denying expansion of Wi-Fi into the U-NII-2B band, there is still the possibility for additional frequency expansion at the top end of the 5 GHz band. The U-NII-4 frequency band, 5.85 GHz-5.925 GHz, is still under consideration for possible use for Wi-Fi communication. The FCC is considering repurposing the lower 45 MHz of the UNII-4 band to be used for Wi-Fi and unlicensed use. The upper 30 MHz of the UNII-4 band would be reaffirmed for automotive ITS using a new LTE cellular technology called C-V2x. Cellular vehicle-to-everything (C-V2X) is an ITS technology meant to enable vehicles to communicate with each other and everything around (example: traffic lights). The FCC is also reconsidering whether an older automotive ITS technology called Dedicated Short Range Communication (DSRC) should still be permitted in the UNII-4 band.'
            },
            {
                id: 12,
                type: 'single',
                question: 'When data is corrupted by previous data from a reflected signal, this is known as what?',
                options: ['Delay spread', 'Intersymbol interference', 'Co-channel interference', 'Adjacent cell interference'],
                correctAnswers: ['Intersymbol interference'],
                explanation: 'If the delay spread is too great, data from a reflected signal may interfere with the same data stream from the main signal; this is referred to as intersymbol interference (ISI). The cause of the problem is delay spread resulting in intersymbol interference (ISI), which causes data corruption.'
            },
            {
                id: 13,
                type: 'single',
                question: 'Assuming all channels are supported by a 5 GHz access point, how many possible 20 MHz channels can be configured on the access point?',
                options: ['4', '11', '12', '25'],
                correctAnswers: ['25'],
                explanation: 'The 802.11-2020 standard states that "the OFDM PHY shall operate in the 5 GHz band, as allocated by a regulatory body in its operational region." A total of twenty-five 20 MHz wide channels are available in the 5 GHz U-NII bands.'
            },
            {
                id: 14,
                type: 'single',
                question: 'Which of these technologies is the most resilient against the negative effects of multipath?',
                options: ['FHSS', 'DSSS', 'HR-DSSS', 'OFDM'],
                correctAnswers: ['OFDM'],
                explanation: 'Because of the lower subcarrier data rates, delay spread is a smaller percentage of the symbol period, which means that ISI is less likely to occur. In other words, OFDM technology is more resistant to the negative effects of multipath than DSSS and FHSS spread spectrum technologies.'
            },
            {
                id: 15,
                type: 'single',
                question: 'What is the average amount of aggregate throughput at any data rate when legacy 802.11a/b/g/n/ac radios are transmitting?',
                options: ['80 percent', '75 percent', '50 percent', '100 percent'],
                correctAnswers: ['50 percent'],
                explanation: 'A medium access method known as Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA) helps to ensure that only one radio can be transmitting on the medium at any given time. Depending on WLAN network conditions, the aggregate WLAN throughput is usually 50 percent of the advertised 802.11 data rate, due to medium contention overhead. 802.11 data rates are not TCP throughput. The medium contention protocol of CSMA/CA consumes much of the available bandwidth. In laboratory conditions, the TCP throughput in an 802.11n/ac environment is 60-70 percent of the data rate between one AP and one client. The aggregate throughput numbers are considerably less in real-world environments with active participation of multiple Wi-Fi clients communicating through an AP.'
            },
            {
                id: 16,
                type: 'multiple',
                question: 'Which of these 802.11 technologies can operate in the 2.4 GHz frequency band? (Choose all that apply.)',
                options: ['802.11a (OFDM radios)', '802.11b (HR-DSSS radios)', '802.11g (ERP radios)', '802.11n (HT radios)', '802.11ac (VHT radios)', '802.11ax (HE radios)'],
                correctAnswers: ['802.11b (HR-DSSS radios)', '802.11g (ERP radios)', '802.11n (HT radios)', '802.11ax (HE radios)'],
                explanation: 'Wi-Fi radios that currently transmit in the 2.4 GHz ISM band include radios that use the following technologies: 802.11b, 802.11g, 802.11n, and 802.11ax.'
            },
            {
                id: 17,
                type: 'single',
                question: 'In the United States, 802.11 radios were not allowed to transmit on which range of frequencies in order to avoid interference with Terminal Doppler Weather Radar (TDWR) systems?',
                options: ['5.15 GHz-5.25 GHz', '5.25 GHz-5.25 GHz', '5.60 GHz-5.65 GHz', '5.85 GHz-5.925 GHz'],
                correctAnswers: ['5.60 GHz-5.65 GHz'],
                explanation: 'In 2009, the Federal Aviation Authority (FAA) reported interference to Terminal Doppler Weather Radar (TDWR) systems. As a result, the FCC suspended certification of 802.11 devices in the U-NII-2A and U-NII-2C bands that require DFS. Certification was eventually re-established; however, the rules changed and 802.11 radios are currently allowed to transmit in the 5.60-5.65 GHz frequency space where TDWR operates. Channels 120-128 were not available for a number of years. As of April 2014, the TDWR frequency space is once again available for 802.11 transmissions in the United States.'
            },
            {
                id: 18,
                type: 'multiple',
                question: 'Which modulation types are used by OFDM technology? (Choose all that apply.)',
                options: ['QAM', 'Phase', 'Frequency', 'Hopping'],
                correctAnswers: ['QAM', 'Phase'],
                explanation: 'OFDM uses BPSK and QPSK modulation for the lower ODFM data rates. The higher OFDM data rates use 16-QAM, 64-QAM, and 256-QAM modulation. QAM modulation is a hybrid of phase and amplitude modulation.'
            },
            {
                id: 19,
                type: 'single',
                question: 'The Barker code converts a bit of data into a series of bits that are referred to as what?',
                options: ['Chipset', 'Chips', 'Convolutional code', 'Complementary code'],
                correctAnswers: ['Chips'],
                explanation: 'When a data bit is converted to a series of bits, these bits that represent the data are known as chips.'
            },
            {
                id: 20,
                type: 'single',
                question: 'Which technology will be needed in the U-NII-5 and U-NII-6 bands to prevent APs from interfering with incumbents in 6 GHz?',
                options: ['DFS', 'AFC', 'TPC', 'QAM'],
                correctAnswers: ['AFC'],
                explanation: 'For outdoor Wi-Fi communications in the U-NII-5 and U-NII-7 bands, the FCC will mandate the use of automated frequency coordination (AFC) to protect the incumbents. An AFC system will use geolocation databases to manage real-time frequency assignments to protect incumbent operations from RF interference.'
            }
        ];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            const shuffledQuestions = shuffleArray([...quizData]);

            shuffledQuestions.forEach((q, index) => {
                const shuffledOptions = shuffleArray([...q.options]);
                const qCard = document.createElement('div');
                qCard.className = 'w-full bg-slate-800 rounded-xl shadow-lg p-6 md:p-8 border border-slate-700';
                
                let optionsHtml = '';
                shuffledOptions.forEach(opt => {
                    const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                    const inputName = `question-${q.id}`;
                    const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                    
                    optionsHtml += `
                        <label id="label-${inputId}" class="flex items-start gap-3 p-4 rounded-lg border border-slate-700 bg-slate-700/30 cursor-pointer hover:bg-slate-700/60 transition-colors w-full">
                            <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-1 w-4 h-4 cursor-pointer text-indigo-600 bg-slate-900 border-slate-600 focus:ring-indigo-500 focus:ring-offset-slate-800">
                            <span class="text-slate-200 leading-relaxed break-words w-full">${opt}</span>
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="mb-6">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-indigo-300 bg-indigo-900/30 rounded-full">
                            ${q.type === 'single' ? 'SINGLE CHOICE' : 'MULTIPLE CHOICE'}
                        </span>
                        <h2 class="text-xl md:text-2xl font-medium text-white leading-snug">
                            <span class="text-indigo-400 font-bold mr-2">${index + 1}.</span>${q.question}
                        </h2>
                    </div>
                    <div class="flex flex-col gap-3" id="options-container-${q.id}">
                        ${optionsHtml}
                    </div>
                    ${q.type === 'multiple' ? `
                        <div class="mt-6 flex justify-end">
                            <button id="btn-${q.id}" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-colors w-full sm:w-auto shadow-md">
                                Check Answer
                            </button>
                        </div>
                    ` : ''}
                    <div id="explanation-${q.id}" class="hidden mt-6 p-5 rounded-lg bg-slate-900 border border-slate-700 shadow-inner">
                        <h4 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2">Explanation</h4>
                        <p class="text-slate-300 text-sm md:text-base leading-relaxed">${q.explanation}</p>
                    </div>
                `;
                
                container.appendChild(qCard);

                const inputs = qCard.querySelectorAll(`input[name="question-${q.id}"]`);
                
                if (q.type === 'single') {
                    inputs.forEach(input => {
                        input.addEventListener('change', () => evaluateAnswer(q, inputs, qCard));
                    });
                } else {
                    const btn = qCard.querySelector(`#btn-${q.id}`);
                    btn.addEventListener('click', () => {
                        evaluateAnswer(q, inputs, qCard);
                        btn.style.display = 'none';
                    });
                }
            });
        }

        function evaluateAnswer(questionData, inputs, cardElement) {
            const explanationBox = cardElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = cardElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-700/60', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-emerald-500', 'bg-emerald-900/30', 'text-emerald-100');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-rose-500', 'bg-rose-900/30', 'text-rose-100');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-emerald-500/50', 'bg-emerald-900/10');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>

</body>
</html>
