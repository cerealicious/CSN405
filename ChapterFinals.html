        :root {

        input[type="radio"], input[type="checkbox"] {

            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
        }

            border-color: #334155;
        }

            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            padding: 0.625rem 0.875rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-answer-input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
        }

        .custom-select {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            outline: none;
        }

        .custom-select:focus {
            border-color: #dc2626;
        }

        .btn-check {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-check:hover {
            background-color: #334155;
        }

        .explanation-box {
            margin-top: 1.25rem;
            padding: 1rem 1.25rem;
            border-radius: 0 0.5rem 0.5rem 0;
            background-color: rgba(30, 41, 59, 0.5);
            border-left: 4px solid #dc2626;
        }
    </style>

            {
                id: 2,

                correctAnswers: ['Block ACK (802.11e)'],
                explanation: 'The 802.11e amendment introduced the Block Acknowledgment (Block ACK) mechanism. It improves channel efficiency by aggregating several acknowledgments into a single acknowledgment frame instead of acknowledging each unicast frame independently. (Chapter 9, Page 335)'
            },
            {
                id: 3,

            {
                id: 4,
                type: 'single',
                question: 'Which combination of 10s and 3s represents a loss of 5 dB?',

            },
            {
                id: 5,

            },
            {

            },
            {
                id: 7,
                type: 'single',
                question: 'In a predictive (virtual) site survey, what is primarily used to simulate wireless coverage before deployment?',

                correctAnswers: ['Floor plans and modeling software'],

            {
                id: 8,

            {

                correctAnswers: ['A BSS is a group of stations that share the same BSSID, which is the MAC address of the access point, enabling communication within the basic service area.'],

            {

            {

            {

            {

            {
                id: 17,
                type: 'text',
                question: '17.  A point-to-point wireless network link operates at a carrier frequency of 2.4GHz. The system has the following link budget parameters:<br> • Transmitter Output Power = <strong>150 mW</strong><br> • Loss due to transmitter cables and connectors: <strong>2.5 dB</strong><br> • Transmitting antenna gain: <strong>26 dBi</strong><br> • Free Space Path Loss (FSPL): <strong>110 dB</strong><br> • Receiving Antenna Gain: <strong>26 dBi</strong><br> • Loss due to receiver cables and connectors: <strong>2.5 dB</strong><br> • Radio Receiver Sensitivity: <strong>-85 dBm </strong>.<br><br>Task:<br>1. Convert the transmitter power from mW to dBm.<br> 2. Calculate the received power (Pr) in dBm using the standard link budget equation:<br> • <strong>PR = PT-Ltx+Gtx-Lpath+Grx-Lrx</strong><br> 3. Using the received power and the receiver sensitivity, determine the Fade Margin (dB).<br> • <strong>Fade Margin = PR-Receiver Sensitivity</strong><br> Enter your final answer as a number only',
                acceptedAnswers: ['20', '44', '20 dB', '44 dB'],
                explanation: 'Accepted answers: 20, 44, 20 dB, 44 dB<br>Pr = 22 - 2.5 + 26 - 110 + 26 - 2.5 = -41 dBm. Fade Margin = -41 - (-85) = 44 dB (or 20 dB depending on exact rounding of 150mW). (Chapter 3)'
            },
            {
                id: 18,
                type: 'multiple',
                question: 'Which of the following are valid calculations when using the rules of 10s and 3s? (Choose Two)',
                options: [
                    'For every 10 dB of loss (absolute), divide the relative power (mW) by a factor of 3.',

                    'For every 10 dB of loss (relative), divide the absolute power (mW) by a factor of 2.',

                question: 'What distinguishes a basic service set (BSS) from an extended service set (ESS) in 802.11 topology?',

            },
            {
                id: 22,
                type: 'text',

            },
            {
                id: 23,

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

                        const btn = qWrapper.querySelector(`#btn-${q.id}`);
                        const textInput = qWrapper.querySelector(`#input-${q.id}`);
                        
                        btn.addEventListener('click', () => {
                            evaluateAnswer(q, textInput, qWrapper);
                            btn.style.display = 'none';
                        });
                        textInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                evaluateAnswer(q, textInput, qWrapper);
                                btn.style.display = 'none';
                            }
                        });
                    }
                });

                container.appendChild(pageDiv);
            }

            setupPaginationControls();
        }

        function setupPaginationControls() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            updatePaginationUI();

            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage--;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage++;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    window.location.reload();
                }
            });
        }

        function updatePaginationUI() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('progress-indicator');

            indicator.textContent = `Page ${currentPage + 1} of ${totalPages}`;

            prevBtn.disabled = currentPage === 0;

            if (currentPage === totalPages - 1) {
                nextBtn.innerHTML = `Restart Quiz <i class="fa-solid fa-rotate-right ml-1"></i>`;
                nextBtn.className = "flex items-center gap-2 px-8 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-md transition-colors shadow-lg shadow-emerald-900/20";
            } else {
                nextBtn.innerHTML = `Next <i class="fa-solid fa-arrow-right ml-1"></i>`;
                nextBtn.className = "flex items-center gap-2 px-8 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-md transition-colors shadow-lg shadow-red-900/20";
            }
        }

        function evaluateAnswer(questionData, inputsOrInput, wrapperElement) {
            const explanationBox = wrapperElement.querySelector(`#explanation-${questionData.id}`);
            
            if (questionData.type === 'text') {
                const inputElem = inputsOrInput;
                const userVal = inputElem.value.trim().toLowerCase();
                inputElem.disabled = true;

                const isCorrect = questionData.acceptedAnswers.some(ans => {
                    const cleanAns = ans.toString().trim().toLowerCase();
                    return userVal === cleanAns || userVal.replace(/\s+/g, '') === cleanAns.replace(/\s+/g, '');
                });

                if (isCorrect) {
                    inputElem.classList.remove('border-slate-700');
                    inputElem.classList.add('bg-emerald-950/40', 'border-emerald-500', 'text-emerald-300');
                } else {
                    inputElem.classList.remove('border-slate-700');
                    inputElem.classList.add('bg-rose-950/40', 'border-rose-500', 'text-rose-300');
                }
            } else if (questionData.type === 'matching') {
                questionData.pairs.forEach((pair, pairIdx) => {
                    const selectElem = wrapperElement.querySelector(`#select-${questionData.id}-${pairIdx}`);
                    const selectedValue = selectElem.value;
                    selectElem.disabled = true;

                    if (selectedValue === pair.correct) {
                        selectElem.classList.add('bg-emerald-950/40', 'border-emerald-500', 'text-emerald-300');
                    } else {
                        selectElem.classList.add('bg-rose-950/40', 'border-rose-500', 'text-rose-300');
                    }
                });
            } else {
                const inputs = inputsOrInput;
                inputs.forEach(input => {
                    const label = wrapperElement.querySelector(`#label-${input.id}`);
                    const isSelected = input.checked;
                    const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                    input.disabled = true;
                    label.classList.remove('hover:bg-slate-800/50', 'cursor-pointer');
                    input.classList.remove('cursor-pointer');

                    if (isSelected && isCorrectAnswer) {
                        label.classList.add('bg-emerald-900/20', 'border-emerald-500/50');
                    } else if (isSelected && !isCorrectAnswer) {
                        label.classList.add('bg-rose-900/20', 'border-rose-500/50');
                    } else if (!isSelected && isCorrectAnswer) {
                        label.classList.add('border-dashed', 'border-emerald-500/50');
                    } else {
                        label.classList.add('opacity-50');
                    }
                });
            }

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-8px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 250, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
