    <script>
        const quizData = [
            {
                id: 1,
                type: 'single',
                question: "Which medium contention and access method is used as the foundation of 802.11 Distributed Coordination Function (DCF)?",
                options: [
                    "Carrier Sense Multiple Access with Collision Detection (CSMA/CD)",
                    "Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA)",
                    "Token passing",
                    "Demand priority"
                ],
                correctAnswers: ["Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA)"],
                explanation: "Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA) is an 802.11 wireless medium access control method that is part of Distributed Coordination Function (DCF). Carrier Sense Multiple Access with Collision Detection (CSMA/CD) is used by 802.3, not 802.11. Token passing is used in Token Ring and Fiber-Distributed Data Interface (FDDI) networking. Demand priority is used in 100BaseVG networking."
            },
            {
                id: 2,
                type: 'single',
                question: "802.11 collision detection is achieved using which technology?",
                options: [
                    "Network allocation vector (NAV)",
                    "Clear channel assessment (CCA)",
                    "Duration/ID value",
                    "Receiving an ACK from the destination station",
                    "Positive collision detection cannot be determined."
                ],
                correctAnswers: ["Positive collision detection cannot be determined."],
                explanation: "802.11 technology does not use collision detection. If an acknowledgment (ACK) frame is not received by the original transmitting radio, the unicast frame is not acknowledged and will have to be retransmitted. This process does not specifically determine whether a collision occurs. Failure to receive an ACK frame from the receiver means that either a unicast frame was not received by the destination station or the ACK frame was not received, but it cannot positively determine the cause. It may be due to collision or to other reasons, such as high noise level. All the other options are used to help prevent collisions."
            },
            {
                id: 3,
                type: 'single',
                question: "ACK and CTS frames follow which interframe space?",
                options: [
                    "EIFS",
                    "DIFS",
                    "PIFS",
                    "SIFS",
                    "AIFS"
                ],
                correctAnswers: ["SIFS"],
                explanation: "Acknowledgment (ACK) frames and clear-to-send (CTS) frames follow a short interframe space (SIFS)."
            },
            {
                id: 4,
                type: 'multiple',
                question: "The carrier sense portion of CSMA/CA is performed by using which of the following methods? (Choose all that apply.)",
                options: [
                    "Contention window",
                    "Backoff timer",
                    "Channel sense window",
                    "Clear channel assessment",
                    "NAV timer"
                ],
                correctAnswers: ["Clear channel assessment", "NAV timer"],
                explanation: "The network allocation vector (NAV) timer maintains a prediction of future traffic on the medium based on duration value information seen in a previous frame transmission. Virtual carrier sense uses the NAV to determine medium availability. Physical carrier sense checks the radio frequency (RF) medium for carrier availability. Physical carrier sense occurs during the clear channel assessment (CCA). The contention window and backoff timer are part of the pseudo-random backoff procedure. A channel sense window does not exist."
            },
            {
                id: 5,
                type: 'single',
                question: "After the station has performed the carrier sense and determined that no other devices are transmitting for a period of a DIFS interval, what is the next step for the station?",
                options: [
                    "Wait the necessary number of slot times before transmitting if a random backoff value has already been selected.",
                    "Begin transmitting.",
                    "Select a random backoff value.",
                    "Begin the random backoff timer."
                ],
                correctAnswers: ["Select a random backoff value."],
                explanation: "The first step is to select a random backoff value. After the value is selected, it is multiplied by the slot time. The random backoff timer then begins counting down the number of slot times. When the number reaches zero, the station can begin transmitting."
            },
            {
                id: 6,
                type: 'multiple',
                question: "Physical carrier sense uses which two thresholds during the clear channel assessment to determine if the medium is busy?",
                options: [
                    "RF detect",
                    "Signal detect",
                    "Transmission detect",
                    "Energy detect",
                    "Random detect"
                ],
                correctAnswers: ["Signal detect", "Energy detect"],
                explanation: "802.11 radios use two separate clear channel assessment (CCA) thresholds when listening to the radio frequency (RF) medium. The signal detect (SD) threshold is used to identify any 802.11 preamble transmissions from another transmitting 802.11 radio. The energy detect (ED) threshold is used to detect any other type of RF transmissions during the clear channel assessment (CCA)."
            },
            {
                id: 7,
                type: 'multiple',
                question: "Which of the following terms are affiliated with the virtual carrier sense mechanism? (Choose all that apply.)",
                options: [
                    "Contention window",
                    "Network allocation vector",
                    "Random backoff time",
                    "Duration/ID field"
                ],
                correctAnswers: ["Network allocation vector", "Duration/ID field"],
                explanation: "The Duration/ID field is used to set the network allocation vector (NAV), which is a part of the virtual carrier sense process. The contention window and random backoff time are part of the backoff process, which is performed after the carrier sense process."
            },
            {
                id: 8,
                type: 'single',
                question: "The goal of allocating equal time as opposed to equal opportunity is known as what?",
                options: [
                    "Access fairness",
                    "Opportunistic medium access",
                    "CSMA/CA",
                    "Airtime fairness"
                ],
                correctAnswers: ["Airtime fairness"],
                explanation: "The goal of airtime fairness is to allocate equal time as opposed to equal opportunity. Access fairness and opportunistic medium access do not exist. Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA) is the normal medium access control mode for Wi-Fi devices."
            },
            {
                id: 9,
                type: 'multiple',
                question: "CSMA/CA and DCF define which mechanisms that attempt to ensure that only one 802.11 radio can transmit on the half-duplex RF medium? (Choose all that apply.)",
                options: [
                    "Pseudo-random backoff timer",
                    "Virtual carrier sense",
                    "Collision detection",
                    "Physical carrier sense",
                    "Interframe spacing"
                ],
                correctAnswers: ["Pseudo-random backoff timer", "Virtual carrier sense", "Physical carrier sense", "Interframe spacing"],
                explanation: "Distributed Coordination Function (DCF) defines four checks and balances of Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA) to ensure that only one 802.11 radio is transmitting on the half-duplex medium. Virtual carrier sense, physical carrier sense, interframe spacing, and the random backoff timer all work together. Collision detection is not part of CSMA/CA."
            },
            {
                id: 10,
                type: 'single',
                question: "The Wi-Fi Alliance certification called Wi-Fi Multimedia (WMM) is based on which wireless medium access method defined by the 802.11-2020 standard?",
                options: [
                    "DCF",
                    "EDCA",
                    "HCCA",
                    "HSRP"
                ],
                correctAnswers: ["EDCA"],
                explanation: "Currently, Wi-Fi Multimedia (WMM) is based on Enhanced Distributed Channel Access (EDCA) mechanisms defined by the 802.11e amendment, which is now part of the 802.11-2020 standard. The WMM certification provides for traffic prioritization via four access categories. EDCA is a subfunction of Hybrid Coordination Function (HCF). The other subfunction of HCF is Hybrid Coordination Function Controlled Channel Access (HCCA)."
            },
            {
                id: 11,
                type: 'single',
                question: "Hybrid Coordination Function (HCF) defines what allotted period of time in which a station can transmit multiple frames?",
                options: [
                    "Target wake time",
                    "Airtime fairness",
                    "Random backoff timer",
                    "NAV timer",
                    "Transmit opportunity"
                ],
                correctAnswers: ["Transmit opportunity"],
                explanation: "Hybrid Coordination Function (HCF) defines the ability of an 802.11 radio to send multiple frames when transmitting on the RF medium. When an HCF-compliant radio contends for the medium, it receives an allotted amount of time to send frames, called a transmit opportunity (TXOP). During the TXOP, an 802.11 radio may send a single frame or multiple frames. During a TXOP, multiple frames can be sent using frame aggregation mechanism or can be sent in a frame burst."
            },
            {
                id: 12,
                type: 'multiple',
                question: "WMM is based on EDCA and provides for traffic prioritization via which of the following access categories? (Choose all that apply.)",
                options: [
                    "WMM Voice priority",
                    "WMM Video priority",
                    "WMM Audio priority",
                    "WMM Best Effort priority",
                    "WMM Background priority"
                ],
                correctAnswers: ["WMM Voice priority", "WMM Video priority", "WMM Best Effort priority", "WMM Background priority"],
                explanation: "WMM Audio priority does not exist. The Wi-Fi Multimedia (WMM) certification provides for traffic prioritization via the four access categories of Voice, Video, Best Effort, and Background."
            },
            {
                id: 13,
                type: 'single',
                question: "As defined by WMM, which type of application traffic has the highest priority for transmission on the half-duplex RF medium?",
                options: [
                    "Best Effort",
                    "Video",
                    "Voice",
                    "Background"
                ],
                correctAnswers: ["Voice"],
                explanation: "The whole point of Wi-Fi Multimedia (WMM) is to prioritize different classes of application traffic during the medium contention process. Traffic in the voice access category has better odds when contending for the medium during the backoff process. For voice traffic, a minimum wait time of a short interframe space (SIFS) plus two slots is required, and then a contention window of 0–3 slots before transmitting on the medium. Best-effort traffic must wait a minimum time of a SIFS and three slots, and then the contention window is 0–15 slots. The contention process is still entirely pseudo-random; however, the odds are better for the voice traffic."
            },
            {
                id: 14,
                type: 'single',
                question: "What information that comes from the wired network is used to assign traffic into access categories on an access point?",
                options: [
                    "Duration/ID",
                    "802.1D priority tags",
                    "Destination MAC address",
                    "Source MAC address"
                ],
                correctAnswers: ["802.1D priority tags"],
                explanation: "The Enhanced Distributed Channel Access (EDCA) medium access method provides for the prioritization of traffic via the use of 802.1D priority tags. 802.1D tags provide a mechanism for implementing quality of service (QoS) at the MAC level. Different classes of service are available, represented in a 3-bit user priority field in an IEEE 802.1Q header added to an Ethernet frame. 802.1D priority tags from the Ethernet side are used to direct traffic to different access-category queues."
            },
            {
                id: 15,
                type: 'multiple',
                question: "What are the two reasons that 802.11 radios use physical carrier sense? (Choose all that apply.)",
                options: [
                    "To synchronize incoming transmissions",
                    "To synchronize outgoing transmissions",
                    "To reset the NAV",
                    "To start the random backoff timer",
                    "To assess the RF medium"
                ],
                correctAnswers: ["To synchronize incoming transmissions", "To assess the RF medium"],
                explanation: "The first purpose is to determine whether a frame transmission is inbound for a station to receive. If the medium is busy, the radio will attempt to synchronize with the transmission. The second purpose is to determine whether the medium is busy before transmitting. This is known as the clear channel assessment (CCA). The CCA involves listening for 802.11 RF transmissions at the Physical layer. The medium must be clear before a station can transmit."
            },
            {
                id: 16,
                type: 'single',
                question: "Which carrier sense method is used to detect and decode 802.11 transmissions?",
                options: [
                    "Network allocation vector",
                    "Signal detect",
                    "Energy detect",
                    "Virtual carrier sense"
                ],
                correctAnswers: ["Signal detect"],
                explanation: "The signal detect (SD) threshold is used to identify any 802.11 preamble transmissions from another transmitting 802.11 radio. The preamble is a component of the Physical layer header of 802.11 frame transmissions. The preamble is used for synchronization between transmitting and receiving 802.11 radios. The SD threshold is sometimes referred to as the preamble carrier sense threshold. The SD threshold is statistically around 4 dB signal-to-noise ratio (SNR) for most 802.11 radios to detect and decode an 802.11 preamble."
            },
            {
                id: 17,
                type: 'single',
                question: "Which field in the MAC header of an 802.11 frame resets the NAV timer for all listening 802.11 stations?",
                options: [
                    "QoS control",
                    "Frame control",
                    "Duration/ID",
                    "Sequence number",
                    "Retry"
                ],
                correctAnswers: ["Duration/ID"],
                explanation: "When the listening radio hears a frame transmission from another station, it looks at the header of the frame and determines whether the Duration/ID field contains a Duration value or an ID value. If the field contains a Duration value, the listening station will set its network allocation vector (NAV) timer to this value. The duration value in any frame is the amount of time after the frame is received that is needed to complete the remaining frame exchange between two radios."
            },
            {
                id: 18,
                type: 'single',
                question: "The EDCA medium access method provides for the prioritization of traffic via priority queues that are matched to eight 802.1D priority tags. What are the EDCA priority queues called?",
                options: [
                    "Traffic streams",
                    "Access categories",
                    "Priority levels",
                    "Priority bits",
                    "Access levels"
                ],
                correctAnswers: ["Access categories"],
                explanation: "Enhanced Distributed Channel Access (EDCA) provides differentiated access for stations by using four access categories. The EDCA medium access method provides for the prioritization of traffic via the four access categories that are aligned to eight 802.1D priority tags."
            },
            {
                id: 19,
                type: 'single',
                question: "ACKs are required for which of the following frames?",
                options: [
                    "Unicast",
                    "Broadcast",
                    "Multicast",
                    "Anycast"
                ],
                correctAnswers: ["Unicast"],
                explanation: "Acknowledgments (ACKs) are used for delivery verification of unicast 802.11 frames. Broadcast and multicast frames do not require an acknowledgment. Anycast frames do not exist."
            },
            {
                id: 20,
                type: 'multiple',
                question: "Which two components of the pseudo-random backoff algorithm are used to create the pseudo-random backoff timer?",
                options: [
                    "Contention window",
                    "Network allocation vector",
                    "Duration/ID",
                    "Slot time"
                ],
                correctAnswers: ["Contention window", "Slot time"],
                explanation: "An 802.11 station may contend for the medium during a window of time known as the backoff time. At this point in the Carrier Sense Multiple Access with Collision Avoidance (CSMA/CA) process, the station selects a random backoff value using a pseudo-random backoff algorithm. The station chooses a random number from a range called a contention window (CW) value. After the random number is chosen, the number is multiplied by the slot time value. This starts a pseudo-random backoff timer. Do not confuse the backoff timer with the NAV timer. The NAV timer is a virtual carrier sense mechanism used to reserve the medium for further transmissions. The pseudo-random backoff timer is the final timer used by a station before it transmits."
            }
        ];

        // Pagination State
        let currentPage = 0;
        const questionsPerPage = 5;
        let totalPages = 0;
        let shuffledQuestions = [];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            shuffledQuestions = shuffleArray([...quizData]);
            totalPages = Math.ceil(shuffledQuestions.length / questionsPerPage);

            // Generate pages
            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.id = `page-${p}`;
                // Hide all pages except the first one
                pageDiv.className = p === 0 ? 'space-y-12' : 'space-y-12 hidden';
                
                const startIdx = p * questionsPerPage;
                const endIdx = Math.min(startIdx + questionsPerPage, shuffledQuestions.length);
                const pageQuestions = shuffledQuestions.slice(startIdx, endIdx);

                pageQuestions.forEach((q, idx) => {
                    const globalQuestionNumber = startIdx + idx + 1;
                    const shuffledOptions = shuffleArray([...q.options]);
                    
                    const qWrapper = document.createElement('div');
                    qWrapper.className = 'exam-question pb-8 border-b border-slate-800/80 last:border-0';
                    
                    let optionsHtml = '';
                    shuffledOptions.forEach(opt => {
                        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                        const inputName = `question-${q.id}`;
                        const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                        
                        optionsHtml += `
                            <label id="label-${inputId}" class="flex items-start gap-4 p-4 rounded-md border border-transparent cursor-pointer hover:bg-slate-800/50 transition-colors w-full">
                                <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-0.5 cursor-pointer">
                                <span class="text-slate-300 leading-relaxed">${opt}</span>
                            </label>
                        `;
                    });

                    qWrapper.innerHTML = `
                        <div class="mb-5 flex gap-3">
                            <span class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-semibold text-sm border border-slate-700">
                                ${globalQuestionNumber}
                            </span>
                            <div class="pt-1">
                                <span class="inline-block px-2 py-0.5 mb-3 text-[10px] font-bold tracking-wider text-slate-400 bg-slate-800 rounded uppercase border border-slate-700/50">
                                    ${q.type === 'single' ? 'Select One' : 'Select All That Apply'}
                                </span>
                                <h3 class="text-lg font-medium text-white leading-snug">${q.question}</h3>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 pl-11" id="options-container-${q.id}">
                            ${optionsHtml}
                        </div>
                        ${q.type === 'multiple' ? `
                            <div class="mt-4 pl-11">
                                <button id="btn-${q.id}" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded border border-slate-600 transition-colors">
                                    Check Selection
                                </button>
                            </div>
                        ` : ''}
                        <div id="explanation-${q.id}" class="hidden mt-6 ml-11 p-4 rounded-r-md bg-slate-800/50 border-l-4 border-red-600">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Explanation</h4>
                            <p class="text-slate-300 text-sm leading-relaxed">${q.explanation}</p>
                        </div>
                    `;
                    
                    pageDiv.appendChild(qWrapper);

                    const inputs = qWrapper.querySelectorAll(`input[name="question-${q.id}"]`);
                    
                    if (q.type === 'single') {
                        inputs.forEach(input => {
                            input.addEventListener('change', () => evaluateAnswer(q, inputs, qWrapper));
                        });
                    } else {
                        const btn = qWrapper.querySelector(`#btn-${q.id}`);
                        btn.addEventListener('click', () => {
                            evaluateAnswer(q, inputs, qWrapper);
                            btn.style.display = 'none';
                        });
                    }
                });

                container.appendChild(pageDiv);
            }

            setupPaginationControls();
        }

        function setupPaginationControls() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            updatePaginationUI();

            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage--;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage++;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Restart state
                    window.location.reload();
                }
            });
        }

        function updatePaginationUI() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('progress-indicator');

            indicator.textContent = `Page ${currentPage + 1} of ${totalPages}`;

            if (currentPage === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentPage === totalPages - 1) {
                nextBtn.innerHTML = `Restart Quiz <i class="fa-solid fa-rotate-right"></i>`;
                nextBtn.classList.replace('bg-red-600', 'bg-emerald-600');
                nextBtn.classList.replace('hover:bg-red-500', 'hover:bg-emerald-500');
                nextBtn.classList.replace('shadow-red-900/20', 'shadow-emerald-900/20');
            } else {
                nextBtn.innerHTML = `Next <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.classList.replace('bg-emerald-600', 'bg-red-600');
                nextBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-red-500');
                nextBtn.classList.replace('shadow-emerald-900/20', 'shadow-red-900/20');
            }
        }

        function evaluateAnswer(questionData, inputs, wrapperElement) {
            const explanationBox = wrapperElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = wrapperElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-800/50', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.add('bg-emerald-900/20', 'border-emerald-500/50');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.add('bg-rose-900/20', 'border-rose-500/50');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.add('border-dashed', 'border-emerald-500/50');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
