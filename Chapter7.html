<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWNA Chapter 7 Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="radio"], input[type="checkbox"] {
            accent-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="max-w-3xl mx-auto mb-10 relative">
        <a href="index.html" class="inline-flex items-center text-indigo-400 hover:text-indigo-300 transition-colors mb-4 text-sm font-medium">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Dashboard
        </a>
        <div class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">Chapter 7: Wireless LAN Topologies</h1>
            <p class="text-slate-400">Complete the questions below. The order of questions and answers are randomized.</p>
        </div>
    </header>

    <!-- Quiz Container -->
    <main id="quiz-container" class="max-w-3xl mx-auto space-y-8 flex flex-col items-center">
        <!-- Questions will be injected here via JavaScript -->
    </main>

    <script>
        const quizData = [
            {
                id: 1,
                type: 'multiple',
                question: 'The logical name of an 802.11 wireless network is known as which type of address? (Choose all that apply.)',
                options: ['BSSID', 'MAC address', 'IP address', 'SSID', 'ESSID'],
                correctAnswers: ['SSID', 'ESSID'],
                explanation: 'The service set identifier (SSID) is an up to 32-character, case-sensitive, logical name used to identify an 802.11 wireless network. An extended service set identifier is the logical network name used in an extended service set (ESS). ESSID is often synonymous with SSID.'
            },
            {
                id: 2,
                type: 'multiple',
                question: 'Which two 802.11 topologies require the use of an AP?',
                options: ['IBSS', 'BSS', 'PBSS', 'ESS'],
                correctAnswers: ['BSS', 'ESS'],
                explanation: 'The 802.11 standard defines four service sets, or topologies. A basic service set (BSS) is defined as one access point (AP) and associated clients. An extended service set (ESS) is defined as one or more BSSs connected by a distribution system medium (DSM). An independent basic service set (IBSS) does not use an AP and consists solely of client stations (STAs). A personal basic service set (PBSS) used by 802.11ad radios is similar to an IBSS because no centralized access point functions as a portal to a DSM.'
            },
            {
                id: 3,
                type: 'single',
                question: 'The 802.11 standard defines which medium to be used in a distribution system?',
                options: ['802.3 Ethernet', '802.4 Token bus', '802.5 Token ring', '802.8 Fiber optic', '802.16 WiMAX', 'None of the above'],
                correctAnswers: ['None of the above'],
                explanation: 'By design, the 802.11 standard does not specify a medium to be used in the distribution system (DS). The distribution system medium (DSM) may be an 802.3 Ethernet backbone, a wireless medium, or any other medium.'
            },
            {
                id: 4,
                type: 'single',
                question: 'Which option is a wireless computer topology used for communication between computer devices within close proximity of a person?',
                options: ['WWAN', 'WMAN', 'WLAN', 'WPAN'],
                correctAnswers: ['WPAN'],
                explanation: 'A wireless personal area network (WPAN) is a short-distance wireless topology. Bluetooth and Zigbee are technologies that are often used in WPANs.'
            },
            {
                id: 5,
                type: 'single',
                question: 'Which 802.11 service set facilitates roaming for Wi-Fi client devices?',
                options: ['ESS', 'BSS', 'IBSS', 'PBSS'],
                correctAnswers: ['ESS'],
                explanation: 'The most common implementation of an extended service set (ESS) has access points (APs) with overlapping coverage cells. The purpose behind an ESS with overlapping coverage cells is seamless roaming.'
            },
            {
                id: 6,
                type: 'multiple',
                question: 'What factors might affect the size of a basic service area (BSA) of an AP? (Choose all that apply.)',
                options: ['Antenna gain', 'CSMA/CA', 'Transmission power', 'Indoor/outdoor surroundings', 'Distribution system'],
                correctAnswers: ['Antenna gain', 'Transmission power', 'Indoor/outdoor surroundings'],
                explanation: 'The size and shape of a basic service area (BSA) can depend on many variables, including access point (AP) transmit power, antenna gain, and physical surroundings. You can also make the argument that the effective shape and range of the BSA is really from the perspective of any connected client station, because all client devices interpret the received signal strength indicator (RSSI) differently.'
            },
            {
                id: 7,
                type: 'multiple',
                question: 'Granted that many enterprise Wi-Fi vendors support the transmission of multiple SSIDs and effectively multiple BSSs from a single AP radio, which of these statements are true? (Choose all that apply.)',
                options: [
                    'When creating multiple SSIDs, the existence of multiple basic service sets (BSSs) results in excessive amounts of MAC layer overhead.',
                    'The maximum number of SSIDs and matching basic service sets per transmitting radio is 8.',
                    'When creating multiple SSIDs, the existence of multiple basic service sets (BSSs) provides more airtime and greater performance.',
                    'The maximum number of SSIDs and matching basic service sets per transmitting radio is 16.',
                    'The maximum number of SSIDs and matching basic service sets per transmitting radio is vendor specific'
                ],
                correctAnswers: [
                    'When creating multiple SSIDs, the existence of multiple basic service sets (BSSs) results in excessive amounts of MAC layer overhead.',
                    'The maximum number of SSIDs and matching basic service sets per transmitting radio is vendor specific'
                ],
                explanation: 'Every WLAN has a logical name (the SSID), and each basic service set (BSS) has a unique layer 2 identifier (the BSSID). The BSSID can be the physical MAC address of the access point radio; however, multiple BSSIDs may be created for a radio interface using sub-interfaces. The multiple BSSIDs are usually increments of the original MAC address of the AP’s radio. Many enterprise Wi-Fi vendors support the transmission of as many as 16 SSIDs and effectively 16 BSSs from a single AP radio. However, the maximum number of SSIDs and BSSIDs per radio is vendor-specific. Additionally, when creating multiple SSIDS, the existence of multiple basic service sets (BSSs) results in excessive amounts of MAC layer overhead.'
            },
            {
                id: 8,
                type: 'multiple',
                question: 'Which terms describe an 802.11 topology involving STAs but no access points? (Choose all that apply.)',
                options: ['BSS', 'Ad hoc', 'DSSS', 'Infrastructure', 'IBSS', 'Peer-to-peer'],
                correctAnswers: ['Ad hoc', 'IBSS', 'Peer-to-peer'],
                explanation: 'The 802.11-2020 standard defines an independent basic service set (IBSS) as a service set using client peer-to-peer communications without the use of an access point (AP). Other names for an IBSS include ad hoc network and peer-to-peer network.'
            },
            {
                id: 9,
                type: 'multiple',
                question: '802.11 client STAs operating in the default infrastructure mode within a normal BSS may communicate in which of the following scenarios? (Choose all that apply.)',
                options: [
                    '802.11 frame exchanges with other 802.11 client STAs via an AP',
                    '802.11 frame TDLS exchanges directly with other client STAs within the BSSs',
                    '802.11 frame IBSS exchanges directly with other client STAs within the BSS',
                    'Frame exchanges with network devices on the DSM',
                    'All of the above'
                ],
                correctAnswers: [
                    '802.11 frame exchanges with other 802.11 client STAs via an AP',
                    '802.11 frame TDLS exchanges directly with other client STAs within the BSSs',
                    'Frame exchanges with network devices on the DSM'
                ],
                explanation: 'Clients that are configured in infrastructure mode may communicate via the access point (AP) with other wireless client stations within a basic service set (BSS). In the typical BSS, peer-to-peer communications from one client station to another client station can occur as long as the traffic is forwarded through the AP. Clients that support tunneled direct link setup (TDLS) are the rare exception to this rule. TDLS-capable clients can communicate directly with each other and bypass the AP. Clients may also communicate through the AP with other networking devices that exist on the distribution system medium (DSM), such as a server or a wired desktop. The integration service of the AP will transfer the MAC service data unit (MSDU) payload from 802.11 wireless clients into an 802.3 frame when Ethernet is the DSM.'
            },
            {
                id: 10,
                type: 'multiple',
                question: 'Which of the following are included in the topologies defined by the 802.11-2020 standard? (Choose all that apply.)',
                options: ['DSSS', 'ESS', 'BSS', 'IBSS', 'FHSS', 'PBSS'],
                correctAnswers: ['ESS', 'BSS', 'IBSS', 'PBSS'],
                explanation: 'The 802.11 topologies, or service sets, defined by the 802.11-2020 standard are the basic service set (BSS), extended service set (ESS), independent basic service set (IBSS), personal basic service set (PBSS), QoS basic service set (QBSS), and mesh basic service set (MBSS). DSSS and FHSS are spread spectrum technologies.'
            },
            {
                id: 11,
                type: 'single',
                question: 'Which wireless topology provides citywide wireless coverage?',
                options: ['WMAN', 'WLAN', 'WPAN', 'WAN', 'WWAN'],
                correctAnswers: ['WMAN'],
                explanation: 'A wireless metropolitan area network (WMAN) provides coverage to a metropolitan area, such as a city and the surrounding suburbs.'
            },
            {
                id: 12,
                type: 'single',
                question: 'At which layer of the OSI model is a BSSID address used?',
                options: ['Physical', 'Network', 'Session', 'Data-Link', 'Application'],
                correctAnswers: ['Data-Link'],
                explanation: 'The basic service set identifier (BSSID) is a 48-bit (6-octet) MAC address. MAC addresses exist at the MAC sublayer of the Data-Link layer of the OSI model. The BSSID is the layer 2 identifier of a basic service set (BSS).'
            },
            {
                id: 13,
                type: 'multiple',
                question: 'The BSSID address can be found in which topologies? (Choose all that apply.)',
                options: ['FHSS', 'IBSS', 'ESS', 'HR-DSSS', 'BSS'],
                correctAnswers: ['IBSS', 'ESS', 'BSS'],
                explanation: 'The basic service set identifier (BSSID) is the layer 2 identifier of either a basic service set (BSS) or an independent basic service set (IBSS). The 48-bit (6-octet) MAC address of an access point’s radio is the BSSID within a BSS. An extended service set (ESS) topology utilizes multiple APs, thus the existence of multiple BSSIDs. In an IBSS network, the first station that powers up randomly generates a virtual BSSID in the MAC address format. FHSS and HR-DSSS are spread spectrum technologies.'
            },
            {
                id: 14,
                type: 'single',
                question: 'Which 802.11 service set defines mechanisms for mesh networking?',
                options: ['BSS', 'PBSS', 'ESS', 'MBSS', 'IBSS'],
                correctAnswers: ['MBSS'],
                explanation: 'The 802.11s-2011 amendment, which is now part of the 802.11-2020 standard, defined a new service set for an 802.11 mesh topology. When access points (APs) support mesh functions, they may be deployed where wired network access is not possible. The mesh functions are used to provide wireless distribution of network traffic, and the set of APs that provide mesh distribution form a mesh basic service set (MBSS).'
            },
            {
                id: 15,
                type: 'single',
                question: 'Which 802.11 service set is defined specifically for directional multi-gigabit (DMG) radios?',
                options: ['BSS', 'ESS', 'IBSS', 'PBSS', 'MBSS'],
                correctAnswers: ['PBSS'],
                explanation: 'Similar to the independent basic service set (IBSS), a personal basic service set (PBSS) is an 802.11 WLAN topology in which 802.11ad stations communicate directly with each other. A PBSS can be established only by directional multi-gigabit (DMG) radios that transmit the 60 GHz frequency band. Similar to an IBSS, no centralized access point (AP) functions as a portal to a distribution system medium (DSM).'
            },
            {
                id: 16,
                type: 'single',
                question: 'The 802.11-2020 standard specifies architectural services that stations use within various 802.11 topologies. Which service is used by both client stations and AP stations?',
                options: ['Station service', 'Distribution service', 'PBSS control point service', 'Integration service', 'Bus service'],
                correctAnswers: ['Station service'],
                explanation: 'The station service (SS) exists in all 802.11 stations, including client stations and access points (APs). The SS provides capabilities such as authentication, deauthentication, data confidentiality, and more. The distribution system service (DSS) operates only within APs and mesh portals. The PBBS control point service (PCPS) is defined specifically for 802.11ad radios when operated in a very specific 802.11 topology, called a personal basic service set (PBSS). The integration service enables delivery of MAC service data units (MSDUs) between the distribution system (DS) and a non-IEEE-802.11 LAN via a portal.'
            },
            {
                id: 17,
                type: 'multiple',
                question: 'A network consisting of clients and two or more APs with the same SSID connected by an 802.3 Ethernet backbone is one example of which 802.11 topology? (Choose all that apply.)',
                options: ['Public basic service set', 'Basic service set', 'Extended service set', 'Independent basic service set', 'Ethernet service set'],
                correctAnswers: ['Extended service set'],
                explanation: 'An extended service set (ESS) is two or more basic service sets (BSSs) connected by a distribution system (DS). An ESS is a collection of multiple access points (APs) and their associated client stations, all united by a single distribution system medium (DSM).'
            },
            {
                id: 18,
                type: 'single',
                question: 'Which term best describes two access points communicating with each other wirelessly while also allowing clients to communicate through the access points?',
                options: ['WDS', 'DS', 'DSS', 'DSSS', 'DSM'],
                correctAnswers: ['WDS'],
                explanation: 'A wireless distribution system (WDS) can connect access points (APs) using a wireless backhaul while allowing clients to also associate to the radios in the access points.'
            },
            {
                id: 19,
                type: 'multiple',
                question: 'What components make up a distribution system? (Choose all that apply.)',
                options: ['HR-DSSS', 'DSS', 'DSM', 'DSSS', 'QBSS'],
                correctAnswers: ['DSS', 'DSM'],
                explanation: 'The distribution system (DS) consists of two main components. The distribution system medium (DSM) is a logical physical medium used to connect access points (APs). The distribution system service (DSS) resides in an AP station and is used to manage client station associations, reassociations, and disassociations.'
            },
            {
                id: 20,
                type: 'single',
                question: 'What type of wireless topology is defined by the 802.11-2020 standard?',
                options: ['WAN', 'WLAN', 'WWAN', 'WMAN', 'WPAN'],
                correctAnswers: ['WLAN'],
                explanation: 'The 802.11-2020 standard is considered a wireless local area network (WLAN) standard. 802.11 hardware can, however, be utilized in other wireless topologies.'
            }
        ];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            const shuffledQuestions = shuffleArray([...quizData]);

            shuffledQuestions.forEach((q, index) => {
                const shuffledOptions = shuffleArray([...q.options]);
                const qCard = document.createElement('div');
                qCard.className = 'w-full bg-slate-800 rounded-xl shadow-lg p-6 md:p-8 border border-slate-700';
                
                let optionsHtml = '';
                shuffledOptions.forEach(opt => {
                    const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                    const inputName = `question-${q.id}`;
                    const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                    
                    optionsHtml += `
                        <label id="label-${inputId}" class="flex items-start gap-3 p-4 rounded-lg border border-slate-700 bg-slate-700/30 cursor-pointer hover:bg-slate-700/60 transition-colors w-full">
                            <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-1 w-4 h-4 cursor-pointer text-indigo-600 bg-slate-900 border-slate-600 focus:ring-indigo-500 focus:ring-offset-slate-800">
                            <span class="text-slate-200 leading-relaxed break-words w-full">${opt}</span>
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="mb-6">
                        <span class="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-indigo-300 bg-indigo-900/30 rounded-full">
                            ${q.type === 'single' ? 'SINGLE CHOICE' : 'MULTIPLE CHOICE'}
                        </span>
                        <h2 class="text-xl md:text-2xl font-medium text-white leading-snug">
                            <span class="text-indigo-400 font-bold mr-2">${index + 1}.</span>${q.question}
                        </h2>
                    </div>
                    <div class="flex flex-col gap-3" id="options-container-${q.id}">
                        ${optionsHtml}
                    </div>
                    ${q.type === 'multiple' ? `
                        <div class="mt-6 flex justify-end">
                            <button id="btn-${q.id}" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-colors w-full sm:w-auto shadow-md">
                                Check Answer
                            </button>
                        </div>
                    ` : ''}
                    <div id="explanation-${q.id}" class="hidden mt-6 p-5 rounded-lg bg-slate-900 border border-slate-700 shadow-inner">
                        <h4 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2">Explanation</h4>
                        <p class="text-slate-300 text-sm md:text-base leading-relaxed">${q.explanation}</p>
                    </div>
                `;
                
                container.appendChild(qCard);

                const inputs = qCard.querySelectorAll(`input[name="question-${q.id}"]`);
                
                if (q.type === 'single') {
                    inputs.forEach(input => {
                        input.addEventListener('change', () => evaluateAnswer(q, inputs, qCard));
                    });
                } else {
                    const btn = qCard.querySelector(`#btn-${q.id}`);
                    btn.addEventListener('click', () => {
                        evaluateAnswer(q, inputs, qCard);
                        btn.style.display = 'none';
                    });
                }
            });
        }

        function evaluateAnswer(questionData, inputs, cardElement) {
            const explanationBox = cardElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = cardElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-700/60', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-emerald-500', 'bg-emerald-900/30', 'text-emerald-100');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-rose-500', 'bg-rose-900/30', 'text-rose-100');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.remove('border-slate-700', 'bg-slate-700/30');
                    label.classList.add('border-emerald-500/50', 'bg-emerald-900/10');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>

</body>
</html>
