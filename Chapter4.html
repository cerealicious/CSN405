    <script>
        const quizData = [
            {
                id: 1,
                type: 'single',
                question: 'Which of the following is a better indicator of what outside influences are affecting an RF signal at a specific moment in time?',
                options: ['RSSI', 'SNR', 'EIRP', 'SINR'],
                correctAnswers: ['SINR'],
                explanation: 'The signal-to-interference-plus-noise ratio (SINR) compares the primary signal to both interference and noise. Since interference fluctuates and can change quickly, this is a better indicator of what is happening to a signal at a specific time. The signal-to-noise (SNR) compares the signal to noise; however, noise is less likely to fluctuate drastically. The received signal strength indicator (RSSI) and equivalent isotropically radiated power (EIRP) are measurements of signal but do not relate the signal to other outside influences.'
            },
            {
                id: 2,
                type: 'single',
                question: 'A point source that radiates RF signal equally in all directions is known as what?',
                options: ['Omnidirectional signal generator', 'Intentional radiator', 'Omnidirectional antenna', 'Nondirectional transmitter', 'Isotropic radiator'],

            },
            {
                id: 3,
                type: 'multiple',
                question: 'When calculating the link budget and system operating margin of a point-to-point outdoor WLAN bridge link, which factors should be taken into account? (Choose all that apply.)',
                options: ['Distance', 'Receive sensitivity', 'Transmit amplitude', 'Antenna height', 'Cable loss', 'Frequency'],
                correctAnswers: ['Distance', 'Receive sensitivity', 'Transmit amplitude', 'Cable loss', 'Frequency'],
                explanation: 'When radio communications are deployed, a link budget is the sum of all gains and losses from the transmitting radio, through the RF medium, to the receiver radio. Link budget calculations include original transmit gain and passive antenna gain. All losses must be accounted for, including free space path loss. Frequency and distance are needed to calculate free space path loss. The height of an antenna has no significance when calculating a link budget; however, the height could affect the required RF line-of-sight needed for the Fresnel Zone to be unobstructed.'
            },
            {
                id: 4,
                type: 'multiple',
                question: 'The sum of all the components from the transmitter to the antenna, not including the antenna, is known as what? (Choose two.)',
                options: ['IR', 'Isotropic radiator', 'EIRP', 'Intentional radiator'],
                correctAnswers: ['IR', 'Intentional radiator'],
                explanation: 'IR is the abbreviation for intentional radiator. The components making up the IR include the transmitter, all cables and connectors, and any other equipment (grounding, lightning arrestors, amplifiers, attenuators, and so forth) between the transmitter and the antenna. The power of the IR is measured at the connecter that provides the input to the antenna.'
            },
            {
                id: 5,
                type: 'single',
                question: 'Which term is used to describe the amount of RF power emitted from the head of an antenna?',
                options: ['Equivalent isotropically radiated power', 'Transmit antenna radiated power', 'Total radiated power', 'Antenna radiated power'],
                correctAnswers: ['Equivalent isotropically radiated power'],
                explanation: 'Equivalent isotropically radiated power, also known as EIRP, is a measure of the strongest signal that is radiated from an antenna.'
            },
            {
                id: 6,
                type: 'multiple',
                question: 'Select the absolute units of power. (Choose all that apply.)',
                options: ['Watt', 'Milliwatt', 'Decibel', 'dBm', 'Bel'],
                correctAnswers: ['Watt', 'Milliwatt', 'dBm'],
                explanation: 'Watts, milliwatts, and dBms are all absolute power measurements. One watt is equal to 1 ampere (amp) of current flowing at 1 volt. A milliwatt is 1/1,000 of 1 watt. dBm is decibels relative to 1 milliwatt.'
            },
            {
                id: 7,
                type: 'multiple',
                question: 'Select the units of comparison (relative). (Choose all that apply.)',
                options: ['dBm', 'dBi', 'Decibel', 'dBd', 'Bel'],
                correctAnswers: ['dBi', 'Decibel', 'dBd', 'Bel'],
                explanation: 'The unit of measurement known as a bel is a relative expression and a measurement of change in power. A decibel (dB) is equal to one-tenth of a bel. Antenna gain measurements of dBi and dBd are relative measurements. dBi is defined as decibels relative to an isotropic radiator. dBd is defined as decibels relative to a dipole antenna.'
            },
            {
                id: 8,
                type: 'single',
                question: '2 dBd is equal to how many dBi?',
                options: ['5 dBi', '4.41 dBi', '4.14 dBi', '2 dBi'],
                correctAnswers: ['4.14 dBi'],

            },
            {
                id: 9,
                type: 'single',
                question: '23 dBm is equal to how many mW?',
                options: ['200 mW', '14 mW', '20 mW', '23 mW', '400 mW'],
                correctAnswers: ['200 mW'],
                explanation: 'To convert dBm to mW, first calculate how many 10s and 3s are needed to add up to 23. Starting at 0 dBm is 0 + 10 + 10 + 3. To calculate the mW, starting at 1mW, you must multiply 1 x 10 x 10 x 2, which calculates to 200 mW.'
            },
            {
                id: 10,
                type: 'single',
                question: 'A wireless bridge is configured to transmit at 100 mW. The antenna cable and connectors produce a 3 dB loss and are connected to a 16 dBi antenna. What is the EIRP?',

                correctAnswers: ['2,000 mW'],
                explanation: 'To reach 100 mW, you can use 10s and 2s along with multiplication and division. Multiplying the initial 1mW value by two 10s will accomplish this. This means that on the dBm side, you must add two 10s to the initial 0 dBm value, which equals 20 dBm. Then subtract the 3 dB of cable loss for a dBm of 17. Because you subtracted 3 from the dBm side, you must divide the 100 mW by 2, giving you a value of 50 mW. Now add in the 16 dBi by adding a 10 and two 3s to the dBm column, giving a total dBm of 33. Because you added a 10 and two 3s, you must multiply the 50 mW by a 10 and two 2s, giving a total of 2,000 mW, or 2 W. Since the cable and connector loss is 3 dB and the antenna gain is 16 dBi, you can add the two together for a cumulative gain of 13 dB; then apply that gain to the 100 mW transmit signal (multiply by 10 and then by 2) to calculate an EIRP of 2,000 mW, or 2 W.'

                correctAnswers: ['4 W'],
                explanation: 'If the original transmit power is 400 mW and cabling induces 9 dB of loss, the power at the opposite end of the cable would be 50 mW. The first 3 dB of cable loss halved the absolute power to 200 mW. The second 3 dB of cable loss halved the absolute power to 100 mW. The final 3 dB of cable loss halved the power to 50 mW. The antenna with 19 dBi of gain passively amplified the 50 mW signal to 4,000 mW. The first 10 dBi of antenna gain boosted the signal to 500 mW. The next 9 dBi of antenna gain doubled the signal three times to a total of 4 watts. Since the cable loss is 9 dB and the antenna gain is 19 dBi, you could add the two together for a cumulative gain of 10 dB and then apply that gain to the 400 mW transmit signal (multiply by 10) to calculate an EIRP of 4,000 mW, or 4 W.'
            },
            {
                id: 12,
                type: 'multiple',

                options: ['Receive sensitivity', 'Roaming', 'Retransmissions', 'Dynamic rate switching'],
                correctAnswers: ['Roaming', 'Dynamic rate switching'],
                explanation: 'Received signal strength indicator (RSSI) thresholds are a key factor for clients when they initiate the roaming handoff. RSSI thresholds are also used by vendors to implement dynamic rate switching, which is a process used by 802.11 radios to shift between data rates.'
            },
            {
                id: 13,
                type: 'single',
                question: 'Received signal strength indicator (RSSI) metrics are used by 802.11 radios to define which RF characteristics?',
                options: ['Signal strength', 'Phase', 'Frequency', 'Modulation'],
                correctAnswers: ['Signal strength'],
                explanation: 'The received signal strength indicator (RSSI) is a metric used by 802.11 radio cards to measure signal strength (amplitude). Some vendors use a proprietary scale to also correlate to signal quality. Most vendors erroneously define signal quality as the signal-to-noise ratio (SNR). The signal-to-noise ratio is the difference in decibels between the received signal and the background noise (noise floor).'
            },
            {
                id: 14,
                type: 'single',
                question: 'dBi is a measure of what?',
                options: [
                    'The output of the transmitter',
                    'The signal increase caused by the antenna',
                    'The signal increase of the intentional transmitter',
                    'The comparison between an isotropic radiator and the transceiver',
                    'The strength of the intentional radiator'

                correctAnswers: ['The signal increase caused by the antenna'],
                explanation: 'dBi is defined as "decibel gain referenced to an isotropic radiator" or "change in power relative to an antenna." dBi is the most common measurement of antenna gain.'
            },
            {
                id: 15,
                type: 'multiple',
                question: 'Which of the following are valid calculations when using the rule of 10s and 3s? (Choose all that apply.)',
                options: [
                    'For every 3 dB of gain (relative), double the absolute power (mW).',

                    'For every 10 dB of loss (absolute), divide the relative power (mW) by a factor of 3.',
                    'For every 10 mW of loss (relative), multiply the absolute power (dB) by a factor of 10.',
                    'For every 10 dB of loss (relative), halve the absolute power (mW).',
                    'For every 10 dB of loss (relative), divide the absolute power (mW) by a factor of 10.'
                ],
                correctAnswers: [
                    'For every 3 dB of gain (relative), double the absolute power (mW).',

                ],
                explanation: 'The four rules of the 10s and 3s are as follows: For every 3 dB of gain (relative), double the absolute power (mW). For every 3 dB of loss (relative), halve the absolute power (mW). For every 10 dB of gain (relative), multiply the absolute power (mW) by a factor of 10. For every 10 dB of loss (relative), divide the absolute power (mW) by a factor of 10.'
            },
            {
                id: 16,
                type: 'single',
                question: 'A WLAN transmitter that emits a 100 mW signal is connected to a cable with a 3 dB loss. If the cable were connected to an antenna with 7 dBi of gain, what would be the EIRP at the antenna element?',
                options: ['200 mW', '250 mW', '300 mW', '400 mW'],
                correctAnswers: ['250 mW'],
                explanation: 'If the original transmit power was 100 mW and cabling induced a 3 dB loss, the power at the opposite end of the cable would be 50 mW. The 3 dB of cable loss halves the absolute power to 50 mW. An antenna with 10 dBi of gain would boost the signal to 500 mW. We also know that 3 dB of loss halves the absolute power. Therefore, an antenna with 7 dBi of gain would amplify the signal to half that of a 10 dBi antenna. The antenna with 7 dBi of gain passively amplifies the 50 mW signal to 250 mW.'
            },
            {
                id: 17,
                type: 'single',
                question: 'In a normal wireless bridged network, the greatest loss of signal is caused by what component of the link?',
                options: ['Receive sensitivity', 'Antenna cable loss', 'Lightning arrestor', 'Free space path loss'],
                correctAnswers: ['Free space path loss'],
                explanation: 'A distance of as little as 100 meters will cause free space path loss (FSPL) of 80 dB, far greater than any other component. RF components such as connectors, lightning arrestors, and cabling all introduce insertion loss. However, FSPL will always be the reason for the greatest amount of loss.'
            },
            {
                id: 18,

                correctAnswers: ['6 dB'],
                explanation: 'The 6 dB rule states that increasing the amplitude by 6 decibels doubles the usable distance of an RF signal. The 6 dB rule is very useful for understanding antenna gain because every 6 dBi of extra antenna gain will double the usable distance of an RF signal.'
            },
            {
                id: 19,
                type: 'single',
                question: 'During a site survey of a point-to-point link between buildings at a manufacturing plant, the WLAN engineer determines that the noise floor is extremely high because of all the machinery that is operating in the buildings. The engineer is worried about the ambient noise from inside the building affecting the outdoor bridge link. What is a suggested best practice to deal with this scenario?',
                options: [
                    'Increase the WLAN bridge access points\' transmission amplitude 5-10 dB.',
                    'Mount the WLAN bridge access points higher.',
                    'Double the distance of the WLAN bridge AP signal with 6 dBi of antenna gain.',
                    'Plan for received amplitude with a 5-10 dB fade margin.'
                ],
                correctAnswers: ['Plan for received amplitude with a 5-10 dB fade margin.'],
                explanation: 'In a high multipath or noisy environment, a common best practice is to add a 5-10 dB fade margin when designing for a WLAN bridge link based on a vendor\'s recommended received signal strength or the noise floor, whichever is louder.'
            },
            {
                id: 20,
                type: 'single',
                question: 'Which value should not be used to compare wireless network radios manufactured by different WLAN vendors?',
                options: ['Maximum data rates', 'Maximum transmit power', 'Antenna gain', 'Received signal strength indicator'],
                correctAnswers: ['Received signal strength indicator'],
                explanation: 'WLAN vendors execute received signal strength indicator (RSSI) metrics in a proprietary manner. The actual range of the RSSI value is from 0 to a maximum value (less than or equal to 255) that each vendor can choose on its own (known as RSSI_Max). Therefore, RSSI metrics should not be used to compare different WLAN vendor radios because there is no standard for the range of values or a consistent scale.'
            }
        ];

        // Pagination State
        let currentPage = 0;
        const questionsPerPage = 5;
        let totalPages = 0;
        let shuffledQuestions = [];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            shuffledQuestions = shuffleArray([...quizData]);
            totalPages = Math.ceil(shuffledQuestions.length / questionsPerPage);

            // Generate pages
            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.id = `page-${p}`;
                // Hide all pages except the first one
                pageDiv.className = p === 0 ? 'space-y-12' : 'space-y-12 hidden';
                
                const startIdx = p * questionsPerPage;
                const endIdx = Math.min(startIdx + questionsPerPage, shuffledQuestions.length);
                const pageQuestions = shuffledQuestions.slice(startIdx, endIdx);

                pageQuestions.forEach((q, idx) => {
                    const globalQuestionNumber = startIdx + idx + 1;
                    const shuffledOptions = shuffleArray([...q.options]);
                    
                    const qWrapper = document.createElement('div');
                    qWrapper.className = 'exam-question pb-8 border-b border-slate-800/80 last:border-0';
                    
                    let optionsHtml = '';
                    shuffledOptions.forEach(opt => {
                        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                        const inputName = `question-${q.id}`;
                        const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                        
                        optionsHtml += `
                            <label id="label-${inputId}" class="flex items-start gap-4 p-4 rounded-md border border-transparent cursor-pointer hover:bg-slate-800/50 transition-colors w-full">
                                <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-0.5 cursor-pointer">
                                <span class="text-slate-300 leading-relaxed">${opt}</span>
                            </label>
                        `;
                    });

                    qWrapper.innerHTML = `
                        <div class="mb-5 flex gap-3">
                            <span class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-semibold text-sm border border-slate-700">
                                ${globalQuestionNumber}
                            </span>
                            <div class="pt-1">
                                <span class="inline-block px-2 py-0.5 mb-3 text-[10px] font-bold tracking-wider text-slate-400 bg-slate-800 rounded uppercase border border-slate-700/50">
                                    ${q.type === 'single' ? 'Select One' : 'Select All That Apply'}
                                </span>
                                <h3 class="text-lg font-medium text-white leading-snug">${q.question}</h3>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 pl-11" id="options-container-${q.id}">
                            ${optionsHtml}
                        </div>
                        ${q.type === 'multiple' ? `
                            <div class="mt-4 pl-11">
                                <button id="btn-${q.id}" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded border border-slate-600 transition-colors">
                                    Check Selection
                                </button>
                            </div>
                        ` : ''}
                        <div id="explanation-${q.id}" class="hidden mt-6 ml-11 p-4 rounded-r-md bg-slate-800/50 border-l-4 border-red-600">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Explanation</h4>
                            <p class="text-slate-300 text-sm leading-relaxed">${q.explanation}</p>
                        </div>
                    `;
                    
                    pageDiv.appendChild(qWrapper);

                    const inputs = qWrapper.querySelectorAll(`input[name="question-${q.id}"]`);
                    
                    if (q.type === 'single') {
                        inputs.forEach(input => {
                            input.addEventListener('change', () => evaluateAnswer(q, inputs, qWrapper));
                        });
                    } else {
                        const btn = qWrapper.querySelector(`#btn-${q.id}`);
                        btn.addEventListener('click', () => {
                            evaluateAnswer(q, inputs, qWrapper);
                            btn.style.display = 'none';
                        });
                    }
                });

                container.appendChild(pageDiv);
            }

            setupPaginationControls();
        }

        function setupPaginationControls() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            updatePaginationUI();

            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage--;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage++;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Restart state
                    window.location.reload();
                }
            });
        }

        function updatePaginationUI() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('progress-indicator');

            indicator.textContent = `Page ${currentPage + 1} of ${totalPages}`;

            if (currentPage === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentPage === totalPages - 1) {
                nextBtn.innerHTML = `Restart Quiz <i class="fa-solid fa-rotate-right"></i>`;
                nextBtn.classList.replace('bg-red-600', 'bg-emerald-600');
                nextBtn.classList.replace('hover:bg-red-500', 'hover:bg-emerald-500');
                nextBtn.classList.replace('shadow-red-900/20', 'shadow-emerald-900/20');
            } else {
                nextBtn.innerHTML = `Next <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.classList.replace('bg-emerald-600', 'bg-red-600');
                nextBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-red-500');
                nextBtn.classList.replace('shadow-emerald-900/20', 'shadow-red-900/20');
            }
        }

        function evaluateAnswer(questionData, inputs, wrapperElement) {
            const explanationBox = wrapperElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = wrapperElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-800/50', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.add('bg-emerald-900/20', 'border-emerald-500/50');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.add('bg-rose-900/20', 'border-rose-500/50');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.add('border-dashed', 'border-emerald-500/50');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
