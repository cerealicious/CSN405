    <script>

            },
            {
                id: 5,

                options: ['Channel information', 'Supported data rates', 'Basic data rates', 'SSID', 'Traffic indication map'],
                correctAnswers: ['Channel information', 'Supported data rates', 'Basic data rates', 'SSID'],

            },
            {
                id: 6,

                explanation: 'Depending on how the To DS and From DS fields are used, the definition of the four MAC fields will change. One constant, however, is that the Address 1 field will always be the receiver address (RA) but may have a second definition as well. The Address 2 field will always be the transmitter address (TA) but also may have a second definition. Address 3 is normally used for additional MAC address information. Address 4 is used only in the case of a WDS.'

                explanation: 'The PS-Poll frame is used by the station to request cached data. The ATIM is used to notify stations in an IBSS of cached data. The Power Management bit is used by the station to notify the AP that the station is going into power-save mode. The DTIM is used to indicate to client stations how often to wake up to receive buffered broadcast and multicast frames. The traffic indication map (TIM) is a field in the beacon frame used by the AP to indicate that there are buffered unicast frames for clients in power-save mode.'

                question: 'When is an 802.11ac AP transmitting on 5 GHz required by the IEEE 802.11-2020 standard to respond to probe request frames from nearby client stations? (Choose all that apply.)',

            },

                id: 13,

            },

                correctAnswers: ['Probe request/response, authentication request/response, association request/response'],

                correctAnswers: ['The WLAN administrator disabled the 1, 2, 5.5, and 11 Mbps data rates.', 'The WLAN administrator enabled the 6 and 9 Mbps data rates as basic rates.'],
                explanation: 'An 802.11n/g AP is backward compatible with 802.11b and supports the HR-DSSS data rates of 1, 2, 5.5, and 11 Mbps, as well as the ERP-OFDM data rates of 6, 9, 12, 18, 24, 36, 48, and 54 Mbps. If a WLAN administrator disabled the 1, 2, 5.5, and 11 Mbps data rates, backward compatibility will effectively be disabled and the 802.11b clients will not be able to connect. The 802.11-2020 standard defines the use of basic rates, which are required rates. If a client station does not support any of the basic rates used by an AP, the client station will be denied association to the BSS. If a WLAN administrator configured the ERP-OFDM data rates of 6 and 9 Mbps as basic rates, the 802.11b (HR-DSSS) clients would be denied association because they do not support those rates.'

                explanation: 'Some 802.11 data frames do not actually carry any data. The Null and QoS Null frames are both non-data-carrying frames. 802.11 data frames have a header and a trailer but do not have a frame body that transports an MSDU payload. These frames are sometimes referred to as null function frames because the payload is null, yet the frames still serve a purpose.'

                id: 19,

                options: ['An action frame can function as a probe request.', 'An action frame can function as a neighbor report request.', 'An action frame can function as a probe response.', 'An action frame can function as a channel switch announcement.', 'An action frame can function as a beacon.'],
                correctAnswers: ['An action frame can function as a neighbor report request.', 'An action frame can function as a channel switch announcement.'],
                explanation: 'An action frame is a type of management frame used to trigger specific actions in a BSS. Action frames can be sent by access points or by client stations. An action frame provides information and direction regarding what to do. An action frame is sometimes referred to as a "management frame that can do anything." A complete list of all the current action frames can be found in section 9.6 of the 802.11-2020 standard. One example of how action frames are used is as a channel switch announcement (CSA) from an AP transmitting on a dynamic frequency selection (DFS) channel. Another example of an action frame is neighbor report requests and responses that 802.11k compliant radios can use. Neighbor report information is used by client stations to gain information from the associated AP about potential roaming neighbors.'

        // Pagination State
        let currentPage = 0;
        const questionsPerPage = 10;
        let totalPages = 0;
        let shuffledQuestions = [];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; 

            shuffledQuestions = shuffleArray([...quizData]);
            totalPages = Math.ceil(shuffledQuestions.length / questionsPerPage);

            // Generate pages
            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.id = `page-${p}`;
                // Hide all pages except the first one
                pageDiv.className = p === 0 ? 'space-y-12' : 'space-y-12 hidden';
                
                const startIdx = p * questionsPerPage;
                const endIdx = Math.min(startIdx + questionsPerPage, shuffledQuestions.length);
                const pageQuestions = shuffledQuestions.slice(startIdx, endIdx);

                pageQuestions.forEach((q, idx) => {
                    const globalQuestionNumber = startIdx + idx + 1;
                    const shuffledOptions = shuffleArray([...q.options]);
                    
                    const qWrapper = document.createElement('div');
                    qWrapper.className = 'exam-question pb-8 border-b border-slate-800/80 last:border-0';
                    
                    let optionsHtml = '';
                    shuffledOptions.forEach(opt => {
                        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                        const inputName = `question-${q.id}`;
                        const inputId = `opt-${q.id}-${Math.random().toString(36).substr(2, 9)}`;
                        
                        optionsHtml += `
                            <label id="label-${inputId}" class="flex items-start gap-4 p-4 rounded-md border border-transparent cursor-pointer hover:bg-slate-800/50 transition-colors w-full">
                                <input type="${inputType}" name="${inputName}" value="${opt.replace(/"/g, '&quot;')}" id="${inputId}" class="mt-0.5 cursor-pointer">
                                <span class="text-slate-300 leading-relaxed">${opt}</span>
                            </label>
                        `;
                    });

                    qWrapper.innerHTML = `
                        <div class="mb-5 flex gap-3">
                            <span class="flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-semibold text-sm border border-slate-700">
                                ${globalQuestionNumber}
                            </span>
                            <div class="pt-1">
                                <span class="inline-block px-2 py-0.5 mb-3 text-[10px] font-bold tracking-wider text-slate-400 bg-slate-800 rounded uppercase border border-slate-700/50">
                                    ${q.type === 'single' ? 'Select One' : 'Select All That Apply'}
                                </span>
                                <h3 class="text-lg font-medium text-white leading-snug">${q.question}</h3>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 pl-11" id="options-container-${q.id}">
                            ${optionsHtml}
                        </div>
                        ${q.type === 'multiple' ? `
                            <div class="mt-4 pl-11">
                                <button id="btn-${q.id}" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded border border-slate-600 transition-colors">
                                    Check Selection
                                </button>
                            </div>
                        ` : ''}
                        <div id="explanation-${q.id}" class="hidden mt-6 ml-11 p-4 rounded-r-md bg-slate-800/50 border-l-4 border-red-600">
                            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Explanation</h4>
                            <p class="text-slate-300 text-sm leading-relaxed">${q.explanation}</p>
                        </div>
                    `;
                    
                    pageDiv.appendChild(qWrapper);

                    const inputs = qWrapper.querySelectorAll(`input[name="question-${q.id}"]`);
                    
                    if (q.type === 'single') {
                        inputs.forEach(input => {
                            input.addEventListener('change', () => evaluateAnswer(q, inputs, qWrapper));
                        });
                    } else {
                        const btn = qWrapper.querySelector(`#btn-${q.id}`);
                        btn.addEventListener('click', () => {
                            evaluateAnswer(q, inputs, qWrapper);
                            btn.style.display = 'none';
                        });
                    }
                });

                container.appendChild(pageDiv);
            }

            setupPaginationControls();
        }

        function setupPaginationControls() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            updatePaginationUI();

            prevBtn.addEventListener('click', () => {
                if (currentPage > 0) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage--;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages - 1) {
                    document.getElementById(`page-${currentPage}`).classList.add('hidden');
                    currentPage++;
                    document.getElementById(`page-${currentPage}`).classList.remove('hidden');
                    updatePaginationUI();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Restart state
                    window.location.reload();
                }
            });
        }

        function updatePaginationUI() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('progress-indicator');

            indicator.textContent = `Page ${currentPage + 1} of ${totalPages}`;

            if (currentPage === 0) {
                prevBtn.disabled = true;
            } else {
                prevBtn.disabled = false;
            }

            if (currentPage === totalPages - 1) {
                nextBtn.innerHTML = `Restart Quiz <i class="fa-solid fa-rotate-right"></i>`;
                nextBtn.classList.replace('bg-red-600', 'bg-emerald-600');
                nextBtn.classList.replace('hover:bg-red-500', 'hover:bg-emerald-500');
                nextBtn.classList.replace('shadow-red-900/20', 'shadow-emerald-900/20');
            } else {
                nextBtn.innerHTML = `Next <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.classList.replace('bg-emerald-600', 'bg-red-600');
                nextBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-red-500');
                nextBtn.classList.replace('shadow-emerald-900/20', 'shadow-red-900/20');
            }
        }

        function evaluateAnswer(questionData, inputs, wrapperElement) {
            const explanationBox = wrapperElement.querySelector(`#explanation-${questionData.id}`);
            
            inputs.forEach(input => {
                const label = wrapperElement.querySelector(`#label-${input.id}`);
                const isSelected = input.checked;
                const isCorrectAnswer = questionData.correctAnswers.includes(input.value);

                input.disabled = true;
                label.classList.remove('hover:bg-slate-800/50', 'cursor-pointer');
                input.classList.remove('cursor-pointer');

                if (isSelected && isCorrectAnswer) {
                    label.classList.add('bg-emerald-900/20', 'border-emerald-500/50');
                } else if (isSelected && !isCorrectAnswer) {
                    label.classList.add('bg-rose-900/20', 'border-rose-500/50');
                } else if (!isSelected && isCorrectAnswer) {
                    label.classList.add('border-dashed', 'border-emerald-500/50');
                } else {
                    label.classList.add('opacity-50');
                }
            });

            explanationBox.classList.remove('hidden');
            explanationBox.animate([
                { opacity: 0, transform: 'translateY(-10px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 300, easing: 'ease-out' });
        }

        document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
